<script>/* 見張り役：画面のプログラムが読めないエラーで止まったら、場所と前後の文字を赤い枠で知らせる（自働化：異常で知らせる） */
window.addEventListener('error',function(e){try{if(window.__appOk)return;var n=e.lineno||0,sc=[].slice.call(document.scripts).sort(function(x,y){return y.text.length-x.text.length})[0],src=(sc?sc.text:'').split('\n'),out=[];   /* 行は「<script>」の行を1行目として数える */
  for(var i=Math.max(0,n-4);i<Math.min(src.length,n+2);i++)out.push((i+1===n?'>>':'  ')+(i+1)+': '+src[i].slice(0,300));
  var d=document.createElement('pre');d.style.cssText='position:fixed;left:0;right:0;bottom:0;max-height:60vh;overflow:auto;z-index:99999;margin:0;padding:10px;background:#fee2e2;color:#7f1d1d;border-top:4px solid #b91c1c;font:12px/1.4 monospace;white-space:pre-wrap';
  d.textContent='画面のプログラムでエラーが出ました。この赤い枠の写真を送ってください\n'+(e.message||'')+'  （'+n+'行 '+(e.colno||'')+'文字目）\n\n'+out.join('\n');
  (document.body||document.documentElement).appendChild(d)}catch(x){}});
</script>

<script>
'use strict';
/* ====== 基本 ====== */
const VER='2026-11-12m';
const XMLH='<'+'?xml version="1.0" encoding="UTF-8" standalone="yes"?'+'>';   /* Googleの画面（HtmlService）が「<と?を続けた並び」を特別に扱うため、文字をつなげて書く */
/* Googleのウェブアプリから開いたとき（Code.gs の画面）は google.script.run でデータ置き場とやりとりする（URLの入力は不要） */
const onGas=typeof google==='object'&&!!(google.script&&google.script.run);
/* 配布用：ここにURLと合言葉が入っていると、ファイルを開くだけで本番（在庫カウントと同じ配り方）。
   リポジトリでは空のまま。設定 →「配布用ファイルをつくる」で入れたファイルを作る */
const PRESET={gasUrl:'',key:'',master:null,mv:0,limit:null,lv:0,delPw:''};   /* master＝配布用ファイルに入れた品番マスタ（在庫カウントと同じく、開くだけで客先のボタンが出る）／mv＝入れた時刻 */
const SRC=document.documentElement.outerHTML;   /* 配布用ファイルを作るための自分のコピー（画面を描く前に取る） */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const r2=x=>Math.round((+x||0)*100)/100;
const fn=x=>String(r2(x));
const remN=j=>Math.max(0,r2((+j.n||0)-(+j.ins||0)));   /* 検査の残り箱数 */
const hm=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
const ymd=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dur=sec=>{sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+pad(m):m)+':'+pad(s)};
const load=(k,d)=>{try{const v=localStorage.getItem('sk_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem('sk_'+k,JSON.stringify(v))}catch(e){}};

const DEFAULT_MASTER=[ /* 仮データ：品番マスタを取り込むと差し替わる（設定→品番マスタ。列：客先,名称,品番・背番） */
 {cust:'客先A',name:'プロテクター',hin:'19P'},{cust:'客先A',name:'ブラケット',hin:'47P'},{cust:'客先A',name:'カバー',hin:'3400'},
 {cust:'客先B',name:'バッテリーケース',hin:'4101'},{cust:'客先B',name:'ステー',hin:'3298'},{cust:'客先C',name:'パネル',hin:'5022'}];
const normM=m=>(m||[]).map(x=>{const o={cust:String(x.cust??x.maker??'').trim()||'未分類',name:String(x.name??'').trim(),hin:String(x.hin??'').trim(),sub:String(x.sub??'').trim(),pn:String(x.pn??'').trim(),kind:String(x.kind??'').trim()};
  return o}).filter(x=>x.hin||x.name).reduce((acc,o)=>{
  /* 前の版で取り込んだ「材料」「完成」別々のボタンは、1行＝1ボタン（材料）にまとめ直す */
  const k=!o.kind&&o.sub.match(/^(.*?)\s*(材料・完成|材料|完成)$/);
  if(k){const pn=k[1],kd=k[2],same=acc.find(x=>x.kind==='row'&&x.cust===o.cust&&x.pn===pn);
    if(same){if(kd!=='完成'){same.hin=o.hin}return acc}
    acc.push({cust:o.cust,name:'',hin:o.hin,pn,kind:'row',sub:pn});return acc}
  acc.push(o);return acc},[]);
const DEFSN=['段取り①+掛け','掛け','検査用段取り','検査'];  /* QR読取（掛け単独画面）はいったん中止。[1]は将来用に残す */
const SN=i=>(S.sn&&S.sn[i])||DEFSN[i];
const DEF={lay:'auto',sn:DEFSN.slice(),name:'タブレット1',role:'kake',mode:onGas||PRESET.gasUrl?'live':'test',split:true,gasUrl:PRESET.gasUrl,key:PRESET.key,etaMin:180,idleMin:15,scale:100};
const firstRun=!load('settings',null);
let S=Object.assign({},DEF,load('settings',{}));
if(!S.gasUrl&&PRESET.gasUrl)S.gasUrl=PRESET.gasUrl;if(!S.key&&PRESET.key)S.key=PRESET.key;
if(!S.delPw||S.delPw==='0000')S.delPw=PRESET.delPw||'0000';   /* データを削除するときのパスワード（はじめは 0000。設定で変えられる。配布用ファイルにも入る） */
if(S.sn&&S.sn[0]==='段取り①')S.sn[0]=DEFSN[0];
if(S.sn&&S.sn[2]==='段取り②')S.sn[2]=DEFSN[2];
if(S.role==='kake')S.role='dan1';
let master=normM(load('master',DEFAULT_MASTER));
if(PRESET.master&&PRESET.master.length&&PRESET.mv>load('masterV',0)){master=normM(PRESET.master);save('master',master);save('masterV',PRESET.mv)}   /* 配布用ファイルの品番マスタが、この端末のものより新しければ使う */
/* リミット表（計画）：{title,times:[分],areas:[{area,cols:[[{part,hours,hanger,qty}]]}]}。Excelの「リミット表」シートから取り込む。配布用ファイルにも入る */
let limit=load('limit',null);
if(PRESET.limit&&PRESET.lv>load('limitV',0)){limit=PRESET.limit;save('limit',limit);save('limitV',PRESET.lv)}
let sess=load('sess',null);          // 掛け作業中：{hin,sei,kb:[{s,e,q}]}
let view='main';
let jobs={};                          // id -> job
let online=true, warn=null, warnTimer=null, alarmOn=false, snoozeUntil=0, alarmTimer=null, modalOpen=false;

const live=()=>S.mode==='live';
const jobsKey=()=>'jobs_'+S.mode;
const sp4=()=>S.mode==='test'&&S.split;
const allV=()=>sp4()||S.role==='all';   /* 3つの工程を横に並べて見る（テスト、または役割「全部の工程」） */
const showDan1=()=>allV()||S.role==='dan1';
const showKake=()=>false;   /* QR読取はいったん中止（全部ハンド入力） */
const showDan2=()=>allV()||S.role==='dan2';
const showKensa=()=>allV()||S.role==='kensa';
const stg=j=>j.stage??3;
const planned=()=>Object.values(jobs).filter(j=>stg(j)===1&&j.st==='wait').sort((a,b)=>a.tp-b.tp);
const stNum=st=>({wait:0,ready:1,done:2}[st]);

/* ====== 音 ====== */
let ac=null;
function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(freq=880,d=.15,times=1){if(!ac)return;for(let i=0;i<times;i++){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=freq;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+i*(d+.08);g.gain.setValueAtTime(.25,t);o.start(t);o.stop(t+d)}}
document.addEventListener('pointerdown',unlockAudio);document.addEventListener('keydown',unlockAudio);

function loadJobs(){jobs=load(jobsKey(),{});const lim=Date.now()-2*864e5;for(const id in jobs){if((jobs[id].st==='done'||jobs[id].st==='cancel')&&(jobs[id].td||jobs[id].t1||jobs[id].tp||0)<lim)delete jobs[id]};shadowAll()}
function saveJobs(){save(jobsKey(),jobs)}
const outbox=()=>load('outbox',{});
let flushing=false;
/* ====== 元に戻す／やり直す ======
   この端末でした操作を、新しい順に最大50回まで。1つの操作で変わった品番（job）の「操作の前」と「あと」の姿を覚えておき、戻すときは前の姿を、やり直すときはあとの姿を保存し直す
   （全端末に同じに伝わる）。新しく作った品番を戻すと「取消」になる。呼び出し（アンドン）は戻せない（鳴り・止まりを後から変えないため） */
const jshadow={},HIST={u:[],r:[]},HMAX=50;
let HB=null,histBusy=false,histLabel='',histNext=null;
function shadowAll(){for(const k in jshadow)delete jshadow[k];for(const id in jobs)jshadow[id]=JSON.stringify(jobs[id])}
function histNote(job){if(histBusy||stg(job)===9)return;if(!HB){HB={};Promise.resolve().then(histFlush)}HB[job.id]=1}
function histFlush(){
  const ids=Object.keys(HB||{}),lab=histLabel,extra=histNext;HB=null;histLabel='';histNext=null;
  const before={},after={};
  ids.forEach(id=>{const a=jobs[id];if(!a)return;const sa=JSON.stringify(a),sb=jshadow[id];jshadow[id]=sa;if(sa===sb)return;before[id]=sb?JSON.parse(sb):null;after[id]=JSON.parse(sa)});
  if(!Object.keys(after).length)return;
  HIST.u.push({label:lab||(Object.keys(after).some(id=>stg(after[id])===10)?'リミット表の編集':''),before,after,extra});if(HIST.u.length>HMAX)HIST.u.shift();HIST.r=[];renderHist();
}
function histApply(snap){
  histBusy=true;
  try{const now=Date.now(),L=Object.keys(snap).map(id=>{const sn=snap[id];let j;
      if(sn)j=JSON.parse(JSON.stringify(sn));
      else{j=JSON.parse(JSON.stringify(jobs[id]));if(stg(j)===10)j.kb={};else{j.st='cancel';j.td=now}}   /* 新しく作ったものを戻す＝取消に */
      return j});
    upsertAll(L);L.forEach(j=>{jshadow[j.id]=JSON.stringify(jobs[j.id])});
  }finally{histBusy=false}
}
function renderHist(){
  const u=HIST.u[HIST.u.length-1],r=HIST.r[HIST.r.length-1],bu=$('#btnUndo'),br=$('#btnRedo');if(!bu||!br)return;
  bu.disabled=!u;br.disabled=!r;
  bu.title=u?'元に戻す'+(u.label?'：'+u.label:''):'元に戻す（戻せる操作はありません）';br.title=r?'やり直す'+(r.label?'：'+r.label:''):'やり直す（やり直せる操作はありません）';
}
function afterHist(){if(view==='jisseki')afterDel()}
function doUndo(){const e=HIST.u.pop();if(!e)return;HIST.r.push(e);histApply(e.before);if(e.extra&&e.extra.undo)e.extra.undo();renderHist();toast('元に戻しました'+(e.label?'：'+e.label:''));afterHist()}
function doRedo(){const e=HIST.r.pop();if(!e)return;HIST.u.push(e);histApply(e.after);if(e.extra&&e.extra.redo)e.extra.redo();renderHist();toast('やり直しました'+(e.label?'：'+e.label:''));afterHist()}
function histClear(){HIST.u=[];HIST.r=[];renderHist()}
function upsertAll(arr){   /* まとめて保存・送信（1回だけ描き直す） */
  const now=Date.now();arr.forEach(j=>{j.u=now;jobs[j.id]=j;histNote(j)});saveJobs();
  if(live()){const ob=outbox();arr.forEach(j=>{ob[j.id]=j});save('outbox',ob);flush()}
  renderAll();
}
function upsert(job){
  job.u=Date.now();jobs[job.id]=job;histNote(job);saveJobs();
  if(live()){const ob=outbox();ob[job.id]=job;save('outbox',ob);flush()}
  renderAll();
}
async function gas(method,params,body){
  if(onGas){
    const req=body?{body:Object.assign({key:S.key||''},body)}:{params:Object.assign({key:S.key||''},params||{})};
    const j=JSON.parse(await new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ng).api(req)));
    if(!j.ok)throw new Error(j.error||'error');return j;
  }
  const url=S.gasUrl.trim();if(!url)throw new Error('no url');
  const u=new URL(url);u.searchParams.set('key',S.key||'');if(params)for(const k in params)u.searchParams.set(k,params[k]);
  u.searchParams.set('_',Date.now());   /* スマホのブラウザが前の答えを使い回さないように、毎回ちがうURLにする（在庫カウントと同じ） */
  if(body)body=Object.assign({key:S.key||''},body);
  const r=await fetch(u.toString(),body?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow',cache:'no-store'}:{redirect:'follow',cache:'no-store'});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j;
}
async function flush(){
  if(!live()||flushing)return;const ob=outbox(),ids=Object.keys(ob);
  if(!ids.length)return;   /* 送るものがないときは表示を変えない（つながっているかは受信で判断する） */
  flushing=true;
  try{
    await gas('POST',null,{action:'upsert',jobs:ids.map(i=>ob[i])});
    const now=outbox();ids.forEach(i=>{if(now[i]&&now[i].u===ob[i].u)delete now[i]});save('outbox',now);setNet(true);
    if(Object.keys(now).length)setTimeout(flush,200);   /* 送っているあいだに増えた分は、5秒待たずに続けて送る */
  }catch(e){setNet(false)}
  flushing=false;
}
async function poll(){
  if(!live())return;
  try{
    const j=await gas('GET',{action:'list'});const ob=outbox();let ch=false;
    for(const x of j.jobs){if(ob[x.id])continue;const c=jobs[x.id];if(!c||x.u>c.u){jobs[x.id]=x;jshadow[x.id]=JSON.stringify(x);ch=true}}
    if(ch){saveJobs();renderAll()}setNet(true);
  }catch(e){setNet(false)}
}
async function fetchMaster(){
  try{const j=await gas('GET',{action:'master'});if(j.master&&j.master.length){master=normM(j.master);save('master',master);save('masterV',Date.now());d1Built=false;return true}}catch(e){}
  return false;
}

/* ====== QR ====== */
/* QRの中身は同品番で全て同じ文字列。受領サンプル3種に対応（全角は半角にそろえてから判定）：
   形式1  AAA,77272-60080,113,30      → 2番目が品番
   形式2  AAA,74043-60020,A0U0,3      → 2番目が品番
   形式3  ＠＞066V…P17526-11010Q12…  → 「P」＋ ddddd-ddddd が品番
   背番号はQRからは確定できないため、品番マスタ（協豊背番号）を引く。 */
const TEST_QR=['AAA,77272-60080,113,30','AAA,74043-60020,A0U0,3',
 '＠＞066V054611V020L2L400138990 4    1L8K7V400138990 4    9K20 116D202611069D0110KR7638020P 33P17526-11010Q12P017K20Ｚ０６３３５１２９９４４８Ｋ０５４６０　　０２５２０　００００００　　　　　　　　　　　　　　　　　　　　　　　　　　　　００００００００　　　　　　０　　　　　　　　Ｅ'];
function parseQR(raw){
  const s=raw.normalize('NFKC').trim();
  let hin=null,m;
  if((m=s.match(/^AAA,([^,]+),/)))hin=m[1].trim();
  else if((m=s.match(/P(\d{5}-\d{5})/)))hin=m[1];
  else if((m=s.match(/\d{5}-\d{5}/)))hin=m[0];
  const mm=master.find(x=>x.hin===(hin||s))||(!hin&&master.find(x=>x.hin&&s.includes(x.hin)));
  return {hin:mm?mm.hin:(hin||s),sei:mm?mm.sei:'',known:!!mm};
}
function setWarn(title,msg,bad){
  warn={title,msg,bad};beep(bad?440:660,.25,bad?3:2);renderKake();
  clearTimeout(warnTimer);warnTimer=setTimeout(()=>{warn=null;renderKake()},7000);
}
function clearWarn(){warn=null;clearTimeout(warnTimer)}

function handleScan(raw){
  raw=(raw||'').trim();if(!raw)return;
  const now=Date.now();
  const q=parseQR(raw);
  if(sess&&nh(sess.hin)!==nh(q.hin)){setWarn('別の品番です','いまの品番（'+sess.hin+'）を完了してから読んでください。',true);return}
  const pj=sess?jobs[sess.jobId]:planned().find(j=>nh(j.hin)===nh(q.hin));
  if(!sess&&!pj){setWarn('生産予定にない品番です',q.hin+'　→ '+SN(0)+'で選ぶか、手入力（特別対応）で追加してください。',true);return}
  addKanban({hin:pj?pj.hin:q.hin,sei:(pj&&pj.sei)||q.sei,jobId:pj?pj.id:null},false,false);
}
function addKanban(q,qrless,unknown){
  const now=Date.now();
  if(!sess)sess={hin:q.hin,sei:q.sei,jobId:q.jobId||null,kb:[],t0:now};
  sess.kb.push({s:now,e:null,q:qrless?1:0});
  clearWarn();stopAlarm();save('sess',sess);
  if(unknown)setWarn('品番マスタに無いQRです','読取は数えました。QR文字列：'+q.hin,false);
  else{beep(1200,.08,1);renderKake()}
}

function promotePlan(v){
  const now=Date.now(),back=JSON.parse(JSON.stringify(plan)),ids=[];
  v.forEach((p,i)=>{const n=+p.box,id='H-'+S.name+'-'+now+'-'+i+'-'+Math.random().toString(36).slice(2,5);ids.push(id);
    upsert({id,tab:S.name,hin:p.hin.normalize('NFKC').trim(),sei:'',maker:'',qty:n,n,nq:n,ins:0,t0:p.t0||now,t1:now,eta:now+S.etaMin*60000,stage:2,st:'wait',tp:now,kb:[]})});
  plan=plan.filter(p=>!v.includes(p)&&(nh(p.hin)||p.box!==''));if(!plan.length)plan=[{hin:'',box:''}];savePlan();buildDan1();
  const planAfter=JSON.parse(JSON.stringify(plan));
  histNext={undo:()=>{plan=JSON.parse(JSON.stringify(back));savePlan();buildDan1()},redo:()=>{plan=JSON.parse(JSON.stringify(planAfter));savePlan();buildDan1()}};   /* 元に戻す／やり直すで、入力欄も同じに */
  toast(v.length+'品番を'+SN(2)+'へ送りました');

/* ====== 優先順番・突発・登録画面 ======

   掛けの開始・終了は kb に [[開始,終了]] で持つ（実績の掛け時間・正味時間の計算に使う）。入力欄から送ったものは 入力開始〜送信 */
function renderPickInto(el,onPick){   /* 品番マスタから 客先→品番 を選ぶ（突発の画面用） */
  if(!el)return;if(!master.length){el.innerHTML='';return}

   ?`<div class="mp"><div class="ttl"><span>① 客先を選ぶ</span></div><div class="gr cu">${custs.map(c=>`<button data-cu="${esc(c)}">${cuLabel(c)}<small style="color:#ddd6fe">${master.filter(m=>m.cust===c).length}品番</small></button>`).join('')}</div></div>`
   :`<div class="mp"><div class="ttl"><span>② ${esc(pickCust)}：名称を選ぶ</span><button class="btn sm back" data-cu="">← 客先にもどる</button></div><div class="gr">${master.filter(m=>m.cust===pickCust).map(m=>m.kind==='row'?`<button data-pk="${esc(m.hin)}">${esc(m.hin)}${m.pn?`<small>${esc(m.pn)}</small>`:''}</button>`:`<button data-pk="${esc(m.hin||m.name)}">${esc(m.name||m.hin)}<small>${esc(m.sub||(m.name?m.hin:''))}</small></button>`).join('')}</div></div>`;
  el.onclick=e=>{const c=e.target.closest('[data-cu]'),k=e.target.closest('[data-pk]');if(c){pickCust=c.dataset.cu||null;renderPickInto(el,onPick)}else if(k)onPick(k.dataset.pk)};
}

  if(kd.ex){
    renderPickInto($('#kpick'),h=>{kd.part=h;$('#kHin').value=h;$('#kchips').innerHTML=stdChips(h,'k');$('#kBx').focus()});
    $('#kHin').oninput=e=>{kd.part=e.target.value;$('#kchips').innerHTML=nh(kd.part)?stdChips(kd.part,'k'):''};
  }
  box.querySelectorAll('.wh').forEach(w=>{const k=w.dataset.k,max=k.endsWith('H')?23:59;
    w.innerHTML='<div class="wi"></div>'+Array.from({length:max+1},(_,v)=>`<div class="wi">${pad(v)}</div>`).join('')+'<div class="wi"></div>';
    const mark=()=>w.querySelectorAll('.wi').forEach((e,i)=>e.classList.toggle('on',i-1===kd.t[k]));
    requestAnimationFrame(()=>{w.scrollTop=kd.t[k]*w.children[1].offsetHeight;mark()});
    let tm=null;w.addEventListener('scroll',()=>{clearTimeout(tm);tm=setTimeout(()=>{if(!w.isConnected)return;const ih=w.children[1].offsetHeight;if(!(ih>0))return;
      kd.t[k]=Math.max(0,Math.min(max,Math.round(w.scrollTop/ih)));mark()},90)});

/* ====== 検査場の操作 ====== */

/* ====== 検査の詳細（品番をタップ） ======

   数が合わないときは理由（不良が出た／前工程の数量が違う／ハンド入力）を選んで自分で修正。修正は記録に残す（adj）。 */
const FIXR=['不良','前工程の数が違う','ハンド入力'];
const BACKR='検査用段取りへ戻す';   /* 修正記録(adj)の理由。これがあり、いま検査用段取りにいる品番は「戻り」 */

      <div class="tp"><span>検査終了</span><div class="wh" data-k="eH"></div><b>:</b><div class="wh" data-k="eM"></div><button class="btn ghost" data-now="e">今</button></div>
      <div class="rb"><span>処理した箱数</span><div class="fx"><button class="btn ghost" data-bx="-1">−1</button><input id="iBx" type="number" min="0" step="1" inputmode="numeric" value="${insp.bx}"><button class="btn ghost" data-bx="1">+1</button></div></div>

/* ====== リミット表（計画と進み具合） ======
   計画＝Excel「リミット表」シート（エリア×リミット時刻に 品番・必要時間・ハンガー・必要数）。
   「済」は自働で付く：今日、同じ品番を検査用段取りへ送信していれば済（同じ品番が何回もあるときは、リミットの早い順に1回ずつ）。
   品番をタップ → 箱数を入れて送信もできる。リミット時刻を過ぎて未完了は赤（見える化・異常を知らせる）。 */
const limitCount=L=>L?L.areas.reduce((a,x)=>a+x.cols.reduce((b,c)=>b+c.length,0),0):0;
function limitFromRows(rows){
  const hi=rows.findIndex(r=>r&&/作業エリア/.test(String(r[0]||'')));if(hi<0)return null;
  const tm=v=>{const t=String(v==null?'':v).trim(),m=t.match(/^(\d{1,2}):(\d{2})/);if(m)return +m[1]*60+ +m[2];const f=parseFloat(t);return f>0&&f<1?Math.round(f*1440):null};
  const cols=[];for(let c=1;c<rows[hi].length;c++){const t=tm(rows[hi][c]);if(t!=null)cols.push({c,t})}
  if(!cols.length)return null;
  const areas=[];let cur=null;
  rows.slice(hi+2).forEach(r=>{if(!r)return;const a=String(r[0]||'').trim();
    if(a){if(a.length>6||/[（(・]/.test(a)){cur=null;return}cur={area:a,cols:cols.map(()=>[])};areas.push(cur)}
    if(!cur)return;
    cols.forEach((k,i)=>{const part=String(r[k.c]||'').normalize('NFKC').trim();if(!part)return;
      const q=parseFloat(r[k.c+3]);cur.cols[i].push({part,hours:String(r[k.c+1]||'').trim(),hanger:String(r[k.c+2]||'').replace(/[\s\u3000]+/g,'').trim(),qty:isNaN(q)?0:Math.round(q)})})});
  const L={title:[rows[0]&&rows[0][0],rows[0]&&rows[0][1]].filter(Boolean).join(' '),times:cols.map(k=>k.t),areas:areas.filter(a=>a.cols.some(c=>c.length))};
  return limitCount(L)?L:null;
}
const hm0=m=>Math.floor(m/60)+':'+pad(m%60);
/* 「必要数」の文字：Excel「掛け置き管理表データ」シートの左の列にある「…必要数」（例：日あたり必要数）の文字に合わせる。なければ「必要数」 */
const QL=()=>(limit&&limit.qtyLabel)||'必要数';
function qtyLabelFrom(rows){for(const r of rows||[])for(let c=0;c<4;c++){const b=String(r&&r[c]||'').trim();if(b&&b.length<=12&&/必要数/.test(b))return b}return null}   /* 左から4列目までの見出し */
/* 標準時間：Excel「管理シート」の「基準時間(s)」（1個あたりの秒）と収容数。掛け＝「基準」×素材の収容数、検査＝「検査」×塗完品の収容数。品番（材料・完成の品番）ごと */

function stdFromRows(rows){
  const has=(r,t)=>r&&r.some(c=>String(c).trim()===t),hi=rows.findIndex(r=>has(r,'メーカー')&&has(r,'材料')&&has(r,'完成'));if(hi<0)return null;
  const H=rows[hi].map(c=>String(c||'').trim()),S=(rows[hi+1]||[]).map(c=>String(c||'').trim());

function masterFromRows(rows){

    rows.slice(hi+1).forEach(r=>{if(!r)return;const mk=String(r[cM]||'').trim();if(!mk)return;

async function readTable(f){

  let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(x){t=new TextDecoder('shift_jis').decode(buf)}

async function readXlsx(buf,pick){   /* pick＝シート名の正規表現（なければ 管理シート→品番マスタ→1枚目）。pick のシートがなければ null */

  const ssT=await get('xl/sharedStrings.xml'),ss=ssT?[...X(ssT).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].filter(t=>t.parentNode.localName!=='rPh').map(t=>t.textContent).join('')):[];   /* ふりがな(rPh)は除く */
  let sheet=null;
  try{const wb=X(await get('xl/workbook.xml')),rl=X(await get('xl/_rels/workbook.xml.rels'));
    const rel={};[...rl.getElementsByTagName('Relationship')].forEach(r=>rel[r.getAttribute('Id')]=r.getAttribute('Target'));
    const sh=[...wb.getElementsByTagName('sheet')].map(e=>({n:e.getAttribute('name')||'',t:rel[e.getAttribute('r:id')||e.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')]}));
    const hit=pick?sh.find(x=>pick.test(x.n)):(sh.find(x=>/^管理シート/.test(x.n))||sh.find(x=>/品番マスタ/.test(x.n))||sh[0]);

  [...doc.getElementsByTagName('row')].forEach(row=>{const r=[];[...row.getElementsByTagName('c')].forEach(c=>{
    const ref=c.getAttribute('r')||'',col=[...ref.replace(/\d/g,'')].reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1,t=c.getAttribute('t');

    r[col<0?r.length:col]=t==='s'?(ss[+(v&&v.textContent)]||''):t==='inlineStr'?[...is].filter(x=>x.parentNode.localName!=='rPh').map(x=>x.textContent).join(''):(v?v.textContent:'')});
    out[(+row.getAttribute('r')||out.length+1)-1]=[...r].map(x=>x==null?'':String(x).trim())});
  return out.filter(Boolean);
}

  }catch(e){}

  <div class="f"><label>到着予定（完了＋分）</label><input id="sEta" type="number" min="1" value="${S.etaMin}"></div>
  <div class="f"><label>押し忘れ警告（分）</label><input id="sIdle" type="number" min="1" value="${S.idleMin}"></div>
  <div class="f"><label>文字の大きさ</label><select id="sScale">${[100,120,150,180].map(v=>`<option value="${v}" ${S.scale==v?'selected':''}>${v}%${v>=150?'（大型モニター向け）':''}</option>`).join('')}</select></div>
  <div class="f"><label>品番マスタ</label><div><button class="btn sm" id="sTpl">ひな形（Excel）をつくる</button><input type="file" id="sCsv" accept=".xlsx,.csv,.txt" style="display:none">
    <div id="sDrop" class="drop"><b>ここにExcelをドラッグ＆ドロップ</b><small>（タッチして選ぶこともできます）</small></div>
    <div class="dnote">現在 ${master.length} 件${load('master',null)?'':'（仮データ）'}<br>ひな形（客先・名称・品番背番）または<br>掛け置きの「管理シート」入りのExcel<br>（「リミット表」シートがあれば、リミット表も取り込みます${limit?'。今 '+limitCount(limit)+' 件':''}）</div><button class="btn sm" id="sGetM" style="margin-top:.4rem">Googleから取得</button></div></div>
  <div class="f"><label>配布用ファイル</label><div><button class="btn sm" id="sDist">配布用ファイルをつくる</button><div class="dnote">上の Apps Script URL と合言葉、<br>品番マスタ（今の ${master.length} 件）${limit?'・リミット表（'+limitCount(limit)+' 件）':''}が入ったHTMLができます。<br>各タブレットに入れて開くだけで本番になります（社外に出さない）</div></div></div>
  <div class="f"><label>削除のパスワード</label><div><button class="btn sm" id="sPw">パスワードを変える</button><div class="dnote">実績のデータを削除するとき・前の日までの残りを消すときに使います<br>（はじめは 0000。配布用ファイルにも入ります）</div></div></div>
  <div class="f"><label>前の日までの残り</label><div><button class="btn sm" id="sOld">前の日までの残りを消す</button><div class="dnote">検査用段取り・検査の一覧に残っている、前の日までの品番を消します。<br>全部のタブレットから消えます（記録は「取消」として残ります）</div></div></div>
  <div class="f"><label>テストデータ</label><button class="btn sm" id="sClr">テストの記録を全部消す</button></div>
  <div class="foot"><button class="btn ghost" data-close>とじる</button><button class="btn fin" id="sSave">保存</button></div>`,()=>{
    $('#sSave').onclick=()=>{
      S.name=$('#sName').value.trim()||'タブレット1';S.sn=[0,1,2,3].map(i=>($('#sn'+i)&&$('#sn'+i).value.trim())||SN(i));d1Built=false;S.role=$('#sRole').value;S.mode=$('#sMode').value;S.split=$('#sSplit').value==='1';S.lay=$('#sLay').value;
      S.gasUrl=$('#sUrl').value.trim();S.key=$('#sKey').value;S.etaMin=+$('#sEta').value||180;S.idleMin=+$('#sIdle').value||15;S.scale=+$('#sScale').value;
      if(S.mode==='live'&&!S.gasUrl&&!onGas){alert('本番にするには Apps Script URL が必要です');return}
      if(S.mode==='live'&&!S.key){alert('本番にするには 合言葉 が必要です');return}
      save('settings',S);loadJobs();histClear();closeModal();layout();renderAll();if(live()){flush();poll();fetchMaster().then(()=>renderAll())}
    };
    $('#sClr').onclick=()=>{if(confirm('テストの記録を全部消します。よいですか？')){save('jobs_test',{});sess=null;save('sess',null);loadJobs();histClear();closeModal();renderAll()}};
    $('#sGetM').onclick=async()=>{S.gasUrl=$('#sUrl').value.trim();S.key=$('#sKey').value;$('#sGetM').textContent=(await fetchMaster())?'取得しました（'+master.length+'件）':'取得できませんでした'};
    $('#sTpl').onclick=()=>downloadMasterTpl();
    $('#sOld').onclick=()=>{const td=ymd(Date.now()),L=oldLeft(td);
      if(!L.length){alert('前の日までの残りはありません');return}
      const n2=L.filter(j=>stg(j)===2).length,n3=L.length-n2;
      askPw('前の日までの残りを消しますか？',`<div class="big">${L.length}件（${esc(SN(2))} ${n2}件・${esc(SN(3))} ${n3}件）</div><div style="color:var(--mut)">全部のタブレットから消えます（記録は「取消」として残ります）</div>`,'消す',()=>{
        const now=Date.now();L.forEach(j=>{j.st='cancel';j.td=now;upsert(j)});toast('前の日までの残り '+L.length+'件を消しました')})};
    $('#sPw').onclick=()=>openModal(`<h3>削除のパスワードを変える</h3>
      <div class="hr" style="margin-top:.4rem"><label class="w">今のパスワード<input id="pwOld" type="password" inputmode="numeric" autocomplete="off"></label>
      <label class="w">新しいパスワード<input id="pwNew" type="password" inputmode="numeric" autocomplete="off"></label>
      <label class="w">新しいパスワード（もう一度）<input id="pwNew2" type="password" inputmode="numeric" autocomplete="off"></label></div>
      <div class="foot"><button class="btn ghost" data-close>やめる</button><button class="btn fin" id="pwSave">変える</button></div>`,()=>{
      $('#pwOld').focus();
      $('#pwSave').onclick=()=>{const o=$('#pwOld').value,n=$('#pwNew').value;
        if(o!==S.delPw){alert('今のパスワードがちがいます');return}
        if(n.length<4){alert('新しいパスワードは4文字以上にしてください');return}
        if(n!==$('#pwNew2').value){alert('新しいパスワードが2つでちがっています');return}
        S.delPw=n;save('settings',S);closeModal();toast('削除のパスワードを変えました')}});
    $('#sDist').onclick=()=>{const u=$('#sUrl').value.trim()||S.gasUrl,k=$('#sKey').value;
      if(!/^https:\/\/script\.google\.com\//.test(u)){alert('Apps Script URL（https://script.google.com/…/exec）を入れてください');return}
      if(!k){alert('合言葉を入れてください');return}
      const pm=load('master',null)?master:null;   /* 取り込んだ品番マスタを入れる（仮データは入れない） */
      const html='<!doctype html>\n'+SRC.replace(/^const PRESET=.*$/m,()=>'const PRESET='+JSON.stringify({gasUrl:u,key:k,master:pm,mv:pm?Date.now():0,limit:limit||null,lv:limit?Date.now():0,delPw:S.delPw==='0000'?'':S.delPw}).replace(/</g,'\\u003c')+';');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='生産管理しくみ_配布用_'+VER+'.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)};
    const importMaster=async f=>{if(!f)return;
      try{const rows=await readTable(f);const m=masterFromRows(rows);
        let L=null;if(/\.xlsx$/i.test(f.name)){const lr=await readXlsx(await f.arrayBuffer(),/^リミット表/);if(lr)L=limitFromRows(lr)}
        if(L){L.qtyLabel=qtyLabelFrom(await readXlsx(await f.arrayBuffer(),/^掛け置き管理表データ/))||'必要数';L.std=stdFromRows(rows)||{};limit=L;save('limit',limit);save('limitV',Date.now())}
        const lmsg=L?'\nリミット表 '+limitCount(L)+' 件も取り込みました':'';
        if(m.length){master=m;save('master',master);save('masterV',Date.now());d1Built=false;pickCust=null;alert('品番マスタ '+m.length+' 件取り込みました'+lmsg)}else if(L)alert(lmsg.trim());else alert('読み取れる行がありません（A 客先・B 名称・C 品番・背番）')}
      catch(x){alert('読み込めませんでした：'+x.message)}};
    $('#sCsv').onchange=e=>{importMaster(e.target.files[0]);e.target.value=''};
    const dz=$('#sDrop');dz.onclick=()=>$('#sCsv').click();
    ['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('over')}));
    ['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('over')}));
    dz.addEventListener('drop',e=>importMaster(e.dataTransfer.files[0]));
  });
}

/* ====== 1秒ごとの更新・フォーカス ====== */
function tick(){
  const now=Date.now();
  document.querySelectorAll('[data-since]').forEach(e=>e.textContent=dur((now-+e.dataset.since)/1000));
  document.querySelectorAll('[data-eta]').forEach(e=>{const r=+e.dataset.eta-now,m=Math.floor(Math.abs(r)/60000);
    e.className='rem '+(r<0?'late':r<30*60000?'soon':'');
    e.textContent=(r<0?'遅れ ':'あと ')+Math.floor(m/60)+':'+pad(m%60)});
  $('#hClock').textContent=hm(now)+':'+pad(new Date(now).getSeconds());
}
function focusScan(){
  if(modalOpen||view!=='main'||!showKake())return;
  const a=document.activeElement;if(a&&a!==document.body&&a!==$('#scan')&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;
  if(a!==$('#scan'))$('#scan').focus({preventScroll:true});
}
setInterval(()=>{
  tick();focusScan();checkAndon();
  if(showKake()&&sess&&sess.kb.length&&!alarmOn&&Date.now()>snoozeUntil){
    const base=Math.max(...sess.kb.map(k=>k.s));
    if(Date.now()-base>S.idleMin*60000)startAlarm();
  }
},1000);
setInterval(()=>{flush();poll()},5000);
setInterval(()=>{if(view==='jisseki'&&!modalOpen&&!jselMode&&!(document.activeElement&&document.activeElement.id==='jd'))renderJisseki();if(view==='limit'&&!modalOpen)renderLimit()},60000);

/* ====== イベント ====== */
$('#scan').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value;e.target.value='';handleScan(v)}});
$('#paneKake').addEventListener('click',e=>{
  const t=e.target.closest('button');
  if(t&&t.dataset.tqr){handleScan(TEST_QR[+t.dataset.tqr]);return}
  if(t&&t.dataset.a){const a=t.dataset.a;
    if(a==='finish')confirmFinish();else if(a==='qrless')pickQrless();else if(a==='cancel')cancelLast();else if(a==='unplan')unplan(t.dataset.id);
    else if(a==='discard')openModal(`<h3>この品番の読取を全部消しますか？</h3><div class="big">${esc(sess.hin)}　${sess.kb.length}枚</div><div class="foot"><button class="btn ghost" data-close>もどる</button><button class="btn end" id="okD">全部消す</button></div>`,()=>{$('#okD').onclick=()=>{closeModal();discardSess()}});
    return}
  focusScan();
});
$('#paneKensa').addEventListener('click',e=>{if(e.target.closest('#kOnly')){openOnly();return}const b=e.target.closest('button[data-st],button[data-dec],button[data-ed]');
  if(!b){const row=e.target.closest('#kensaBody .job');if(row&&Date.now()-lastDragEnd>500)openInsp(row.dataset.id);return}const id=b.closest('[data-id]').dataset.id;
  if(b.dataset.ed)openQty(id,'kensa');else if(b.dataset.dec)decOne(id);else setStatus(id,b.dataset.st)});
/* 長押しで順番入れ替え */
function dropIndex(d,y){const others=[...$('#kensaBody').querySelectorAll('.job')].filter(x=>x!==d.c);let i=0;others.forEach(o=>{const b=o.getBoundingClientRect();if(b.top+b.height/2<y)i++});return{i,others}}
let lastDragEnd=0;
function endDrag(commit){
  const d=drag;if(!d)return;clearTimeout(d.t);drag=null;if(!d.on)return;
  lastDragEnd=Date.now();d.c.classList.remove('drag');d.c.style.transform='';
  document.querySelectorAll('.job.drop,.job.dropb').forEach(x=>x.classList.remove('drop','dropb'));
  if(commit&&d.ni!=null){
    const ids=Object.values(jobs).filter(j=>j.st==='wait'&&stg(j)===3).sort(byOrder).map(j=>j.id).filter(x=>x!==d.id);
    ids.splice(d.ni,0,d.id);
    ids.forEach((id,k)=>{if(jobs[id].ord!==k){jobs[id].ord=k;upsert(jobs[id])}});
    toast('順番を入れ替えました');
  }
  renderKensa();
}
const kb_=$('#kensaBody');
kb_.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.job');if(!c||e.target.closest('button')||qv('q3'))return;
  const d={c,id:c.dataset.id,x:e.clientX,y:e.clientY,on:false,ni:null};drag=d;
  d.t=setTimeout(()=>{d.on=true;c.classList.add('drag');try{c.setPointerCapture(e.pointerId)}catch(x){}if(navigator.vibrate)navigator.vibrate(30)},500);
});
kb_.addEventListener('pointermove',e=>{
  const d=drag;if(!d)return;
  if(!d.on){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>12){clearTimeout(d.t);drag=null}return}
  e.preventDefault();d.c.style.transform='translateY('+(e.clientY-d.y)+'px)';
  const{i,others}=dropIndex(d,e.clientY);d.ni=i;
  others.forEach(o=>o.classList.remove('drop','dropb'));
  if(others[i])others[i].classList.add('drop');else if(others.length)others[others.length-1].classList.add('dropb');
});
kb_.addEventListener('pointerup',()=>endDrag(true));
kb_.addEventListener('pointercancel',()=>endDrag(false));
kb_.addEventListener('contextmenu',e=>{if(e.target.closest('.job'))e.preventDefault()});
document.addEventListener('touchmove',e=>{if(drag&&drag.on)e.preventDefault()},{passive:false});
$('#paneDan1').addEventListener('input',e=>{
  const row=e.target.closest('.hr');if(!row)return;const p=plan[+row.dataset.i];if(!p)return;
  if(!p.t0)p.t0=Date.now();
  if(e.target.classList.contains('f-hin'))p.hin=e.target.value;else if(e.target.classList.contains('f-box'))p.box=e.target.value;
  savePlan();updDan1();
});
$('#paneDan1').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;const t=e.target;if(!t.closest('.hr'))return;e.preventDefault();
  const row=t.closest('.hr');
  if(t.classList.contains('f-hin'))row.querySelector('.f-box').focus();
  else if(t.classList.contains('f-box')){if(row.matches(':last-child')&&nh(plan[+row.dataset.i].hin))addRow();else{const nx=row.nextElementSibling;if(nx)nx.querySelector('.f-hin').focus()}}
});
$('#paneDan1').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');if(!d)return;
  plan.splice(+d.dataset.del,1);if(!plan.length)plan.push({hin:'',box:''});savePlan();buildDan1();
});
$('#d1pick').addEventListener('click',e=>{const c=e.target.closest('[data-cu]'),k=e.target.closest('[data-pk]');
  if(c){pickCust=c.dataset.cu||null;renderPick()}else if(k)pickItem(k.dataset.pk)});
$('#d1sent').addEventListener('click',e=>{if(e.target.closest('#d1sentBtn')){sentOpen=!sentOpen;updDan1()}});
$('#d1add').onclick=addRow;$('#d1ok').onclick=confirmPlan;
$('#kPri').onclick=openKakePri;$('#kEx').onclick=()=>openKake(null,'',true);
$('#paneDan2').addEventListener('click',e=>{const b=e.target.closest('button[data-adv],button[data-ed]');if(!b)return;const id=b.closest('[data-id]').dataset.id;if(b.dataset.ed)openQty(id,'dan2');else advance(id)});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;layout();renderHeader();if(view==='jisseki')renderJisseki();else renderAll()});
$('#jissekiBody').addEventListener('click',e=>{
  const cd=e.target.closest('[data-cd]');if(cd){jdate=cd.dataset.cd;jsel.clear();renderJisseki();return}   /* グラフの点を押す → その日の実績表 */
  if(e.target.closest('#jDelMode')){jselMode=true;jsel.clear();jShell();jDraw();return}
  if(e.target.closest('#jDelCancel')){jselMode=false;jsel.clear();jShell();jDraw();return}
  if(e.target.closest('#jSelAll')){const ids=jsh?jsh.ids:[],all=ids.length&&ids.every(i=>jsel.has(i));ids.forEach(i=>all?jsel.delete(i):jsel.add(i));jRefreshSel();return}
  if(e.target.closest('#jDelGo')){delJissekiSel();return}
  const tr=e.target.closest('tr[data-jid]');if(tr&&jselMode){const id=tr.dataset.jid;jsel.has(id)?jsel.delete(id):jsel.add(id);jRefreshSel()}   /* 行のどこを押しても選べる */
});
$('#btnSet').onclick=openSettings;
$('#btnUndo').onclick=doUndo;$('#btnRedo').onclick=doRedo;
document.addEventListener('keydown',e=>{   /* パソコン：Ctrl+Z で元に戻す、Ctrl+Y（Ctrl+Shift+Z）でやり直す。入力欄の中では使わない */
  if(!(e.ctrlKey||e.metaKey)||modalOpen)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  const k=e.key.toLowerCase();if(k==='z'&&!e.shiftKey){e.preventDefault();doUndo()}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();doRedo()}});
$('#q2').addEventListener('input',renderDan2);$('#q3').addEventListener('input',renderKensa);
document.querySelectorAll('[data-qc]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.qc);i.value='';b.dataset.qc==='q2'?renderDan2():b.dataset.qc==='qk'?renderDan1():renderKensa();i.focus()});
['dragover','drop'].forEach(t=>window.addEventListener(t,e=>{if(!e.target.closest||!e.target.closest('#sDrop'))e.preventDefault()}));
/* 手動更新：未送信を送り、最新を受け取って画面を描き直す */
$('#btnRef').onclick=async()=>{
  if(live()){await flush();await poll();await fetchMaster()}else loadJobs();   /* 更新：品番マスタ（客先のボタン）も読み直す */
  if(view==='jisseki')renderJisseki();else renderAll()
  toast('最新の状態に更新しました（'+hm(Date.now())+'）');
};
$('#btnFull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};

/* ====== 起動 ====== */
loadJobs();layout();renderAll();tick();renderHist();window.__appOk=true;
if(live()){flush();poll();fetchMaster().then(ok=>{if(ok)renderAll()})}   /* 品番マスタを読んだら客先のボタンを描き直す */
if(live()&&(firstRun||!S.key))setTimeout(openSettings,500);   /* 初めて開いたタブレット（配布用ファイル・Google）：タブレット名・役割（・合言葉）を入れてもらう */
</script>
</body>
</html>
