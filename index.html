<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生産管理しくみ</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#cbd5e1;
--kake:#1d4ed8;--kake-bg:#dbeafe;--kensa:#15803d;--kensa-bg:#dcfce7;
--warn:#92400e;--warn-bg:#fef3c7;--bad:#b91c1c;--bad-bg:#fee2e2}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Meiryo",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:.5rem;padding:.5rem 1rem;background:var(--kake);color:#fff;flex-wrap:wrap}
header.r-kensa{background:var(--kensa)}
header.r-both{background:#334155}
header h1{font-size:1.15rem;margin:0;font-weight:800}
.chip{background:rgba(255,255,255,.2);border-radius:99px;padding:.2rem .8rem;font-size:.95rem;font-weight:700}
.chip.ng{background:#fbbf24;color:#451a03}
.sp{flex:1}
.tab,.ibtn{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:.6rem;padding:.45rem .75rem;font-size:.95rem;font-weight:700;cursor:pointer;min-height:2.6rem}
.tab.on{background:#fff;color:#0f172a}
.ver{font-size:.85rem;opacity:.85}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr}
main.split{grid-template-columns:1fr 1fr;gap:2px;background:#94a3b8}
.pane{min-height:0;overflow:auto;background:var(--bg);position:relative}
.pane.hide{display:none}
.panehead{position:sticky;top:0;z-index:5;padding:.4rem 1rem;font-weight:800;font-size:1rem;color:#fff}
.ph-kake{background:var(--kake)}.ph-kensa{background:var(--kensa)}
.scanbar{display:flex;align-items:center;gap:.6rem;padding:.5rem 1rem;background:#fff;border-bottom:1px solid var(--line)}
.scanbar .dot{width:.9rem;height:.9rem;border-radius:50%;background:#16a34a;flex:none}
.scanbar input{flex:1;border:2px dashed var(--line);border-radius:.6rem;padding:.5rem .8rem;font-size:1.1rem;min-width:0}
.scanbar input:focus{border-color:var(--kake);outline:0}
.body{padding:1rem;display:flex;flex-direction:column;gap:.9rem}
.now{background:var(--card);border-radius:1rem;padding:1rem 1.2rem;border:2px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:.2rem 1rem;align-items:center}
.now.act{border-color:var(--kake)}
.now .hin{font-size:2.2rem;font-weight:900;word-break:break-all}
.now .hin.empty{font-size:1.6rem;color:var(--mut)}
.now .sei{color:var(--mut);font-size:1.1rem}
.now .count{grid-row:1/3;grid-column:2;text-align:right;font-size:1.3rem;font-weight:700}
.now .count b{font-size:5rem;line-height:1;color:var(--kake)}
.now .meta{grid-column:1/3;color:var(--mut);font-size:1rem}
.warnbox{border-radius:.8rem;padding:.8rem 1rem;font-weight:700;font-size:1.15rem;background:var(--warn-bg);color:var(--warn);border:2px solid #f59e0b}
.warnbox.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.kbs{background:var(--card);border-radius:1rem;border:1px solid var(--line);overflow:hidden}
.kb{display:grid;grid-template-columns:3rem 1fr auto;gap:.5rem;padding:.55rem 1rem;border-bottom:1px solid #e2e8f0;align-items:center;font-size:1.05rem}
.kb:last-child{border:0}
.kb .no{font-weight:800;color:var(--mut)}
.tag{border-radius:.4rem;padding:.1rem .6rem;font-size:.9rem;font-weight:800}
.tag.work{background:var(--kake-bg);color:var(--kake)}
.tag.fin{background:#e2e8f0;color:#334155}
.tag.nq{background:var(--warn-bg);color:var(--warn);margin-left:.4rem}
.actions{position:sticky;bottom:0;background:var(--bg);padding:.6rem 0 .2rem;display:grid;grid-template-columns:1fr;gap:.8rem}.actions .btn{min-height:4.6rem;font-size:1.6rem}
.btn{min-height:3.6rem;padding:0 1.2rem;font-size:1.3rem;font-weight:800;border-radius:.9rem;border:0;cursor:pointer;color:#fff;background:#475569}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.end{background:#ea580c}.btn.fin{background:var(--kake)}
.btn.ok{background:var(--kensa)}.btn.insp{background:#0f766e}
.btn.sm{min-height:2.8rem;font-size:1rem;background:#fff;color:#0f172a;border:2px solid var(--line)}
.btn.ghost{background:#fff;color:#0f172a;border:2px solid var(--line)}
.row{display:flex;gap:.6rem;flex-wrap:wrap}
.testqr{background:#fff;border:1px dashed #94a3b8;border-radius:.8rem;padding:.6rem .8rem;font-size:.9rem;color:var(--mut)}
.testqr button{margin:.2rem .3rem .2rem 0}
/* 検査場 */
.sum{display:flex;gap:.5rem;flex-wrap:wrap}
.sum .s{background:#fff;border:2px solid var(--line);border-radius:.7rem;padding:.3rem .8rem;font-weight:800;font-size:1.05rem}
.sum .s b{color:var(--kensa);font-size:1.3rem}
h2{margin:.2rem 0;font-size:1.05rem;color:#334155}
.job{background:var(--card);border-radius:1rem;border:2px solid var(--line);padding:.8rem 1rem;display:grid;grid-template-columns:2.2rem 6.5rem 1fr auto;gap:.4rem 1rem;align-items:center}
.job{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.job.drag{position:relative;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.35);border-color:var(--kensa);opacity:.95;transition:none}.job.drop{border-top:8px solid #f59e0b}.job.dropb{border-bottom:8px solid #f59e0b}.hint{color:var(--mut);font-size:.9rem}
h2 .hint{display:block;font-weight:600;margin-top:.15rem}
.job .no{font-size:1.4rem;font-weight:900;color:var(--mut);text-align:center}
.stack{position:relative;background:var(--kensa-bg);border-radius:.6rem;text-align:center;padding:.5rem .2rem;border:2px solid var(--kensa);margin-bottom:.4rem}
.stack.s1{box-shadow:0 5px 0 -1px #86efac,0 5px 0 0 var(--kensa)}
.stack.s2{box-shadow:0 5px 0 -1px #86efac,0 5px 0 0 var(--kensa),0 10px 0 -1px #bbf7d0,0 10px 0 0 var(--kensa)}
.stack.s3{box-shadow:0 5px 0 -1px #86efac,0 5px 0 0 var(--kensa),0 10px 0 -1px #bbf7d0,0 10px 0 0 var(--kensa),0 15px 0 -1px #dcfce7,0 15px 0 0 var(--kensa)}
.stack b{font-size:2.6rem;line-height:1;color:var(--kensa)}
.stack span{font-weight:800;color:var(--kensa)}
.job .hin{font-size:1.9rem;font-weight:900;word-break:break-all}
.job .sei{color:var(--mut);font-size:1.05rem}
.job .meta{color:var(--mut);font-size:.95rem}
.job .eta{text-align:right}
.job .eta .l{font-size:.85rem;color:var(--mut)}
.job .eta .t{font-size:2rem;font-weight:900}
.rem{font-weight:800;font-size:1.05rem}
.rem.soon{color:#c2410c}.rem.late{color:var(--bad)}
.job .btns{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.readyrow{display:flex;gap:.6rem;flex-wrap:wrap}
.rdy{background:#fff;border:2px solid var(--kensa);border-radius:.8rem;padding:.4rem .6rem .4rem .9rem;display:flex;align-items:center;gap:.8rem;font-weight:800}
.rdy .btn{min-height:2.6rem;font-size:1rem;padding:0 .9rem}
.empty{color:var(--mut);text-align:center;padding:2.5rem 1rem;font-size:1.2rem}
/* 実績 */
table{border-collapse:collapse;width:100%;background:#fff;font-size:1rem}
th,td{border:1px solid var(--line);padding:.4rem .6rem;text-align:left}
th{background:#e2e8f0}
.jt{font-size:.92rem;white-space:nowrap}.jt th{text-align:center;font-size:.85rem}.jt .g1{background:#ede9fe}.jt .g2{background:#f3e8ff}.jt .g3{background:#dcfce7}.jt .g4{background:#fee2e2}
.jt .gl{border-left:3px solid #64748b}.jt .tb{font-weight:800;background:#f8fafc}
td.n,th.n{text-align:right}
input,select{font-size:1.05rem;padding:.5rem .7rem;border:2px solid var(--line);border-radius:.6rem;background:#fff}
/* modal etc */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:1rem}
#modal.on{display:flex}
.dlg{background:#fff;border-radius:1.1rem;padding:1.3rem;max-width:44rem;width:100%;max-height:92vh;overflow:auto}
.dlg h3{margin:.1rem 0 .8rem;font-size:1.4rem}
.dlg .big{font-size:2.2rem;font-weight:900;margin:.3rem 0}
.dlg .f{display:grid;grid-template-columns:11rem 1fr;gap:.5rem .8rem;align-items:center;margin:.5rem 0}
.dlg .f label{font-weight:700}
.dlg .f small{grid-column:2;color:var(--mut);margin-top:-.3rem}
.dlg .foot{display:flex;gap:.7rem;justify-content:flex-end;margin-top:1rem;flex-wrap:wrap}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;max-height:46vh;overflow:auto;margin-top:.6rem}
.pick button{text-align:left;padding:.7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;font-size:1.1rem;font-weight:800;cursor:pointer}
.pick button small{display:block;color:var(--mut);font-weight:600}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#0f172a;color:#fff;padding:.8rem 1.2rem;border-radius:.9rem;display:none;gap:1rem;align-items:center;z-index:70;font-weight:700;font-size:1.05rem}
#toast.on{display:flex}
#toast button{background:#fbbf24;border:0;border-radius:.5rem;padding:.4rem .9rem;font-weight:800;font-size:1rem;cursor:pointer}
#alarm{position:fixed;inset:0;background:rgba(185,28,28,.94);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;z-index:80;text-align:center;padding:1rem;animation:bl 1s infinite}
#alarm.on{display:flex}
#alarm h2{font-size:2.4rem;color:#fff;margin:0}
#alarm p{font-size:1.5rem;margin:0}
@keyframes bl{50%{background:rgba(127,29,29,.94)}}
header.r-dan{background:#6d28d9}
.ibtn.andon{background:#facc15;color:#111;font-size:1.1rem;padding:.45rem 1rem;border:3px solid #fff}
#andon{position:fixed;inset:0;background:#facc15;color:#111;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:90;text-align:center;padding:1rem;animation:an .6s infinite}
#andon.on{display:flex}
@keyframes an{50%{background:#dc2626;color:#fff}}

.anl{display:flex;flex-direction:column;gap:.8rem;width:min(46rem,100%)}
.an1{background:rgba(255,255,255,.92);color:#111;border-radius:1rem;padding:1rem;display:flex;flex-wrap:wrap;gap:.8rem;align-items:center;justify-content:space-between;font-size:1.6rem;font-weight:900}
.an1 small{display:block;font-size:1.1rem;color:#475569;font-weight:700}
.an1 .btn{min-height:4rem;font-size:1.5rem}
.rsn{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;margin-top:.6rem}.rsn .btn{min-height:5rem;font-size:1.6rem}
#start{position:fixed;inset:0;background:rgba(15,23,42,.92);color:#fff;display:none;align-items:center;justify-content:center;z-index:95;text-align:center;font-size:1.8rem;font-weight:900;cursor:pointer;padding:1rem}
#start.on{display:flex}
.ph-dan{background:#6d28d9}
main.split.four{grid-template-columns:repeat(3,minmax(0,1fr))}
main.four .job{grid-template-columns:2rem 4.8rem 1fr;gap:.3rem .6rem;padding:.6rem}
main.four .job .eta{grid-column:1/-1;text-align:left;display:flex;gap:.8rem;align-items:baseline}
main.four .job .hin{font-size:1.4rem}main.four .stack b{font-size:2rem}
main.four .now{grid-template-columns:1fr}main.four .now .count{grid-row:auto;grid-column:1;text-align:left}
main.four .now .hin{font-size:1.5rem}main.four .now .count b{font-size:3.2rem}
.hr{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:.5rem .6rem;background:#fff;border:2px solid var(--line);border-radius:.8rem;padding:.7rem .8rem;margin-bottom:.6rem}
.sent{background:#fff;border:1px solid var(--line);border-radius:.8rem;overflow:hidden}.sent div{display:flex;justify-content:space-between;padding:.45rem .9rem;border-bottom:1px solid #e2e8f0;font-weight:700}.sent div:last-child{border:0}.sent small{color:var(--mut);font-weight:600}
.ckr{display:flex;align-items:center;gap:.8rem;font-size:1.3rem;font-weight:800;padding:.55rem .3rem;border-bottom:1px solid #e2e8f0;cursor:pointer}.ckr input{width:1.9rem;height:1.9rem;flex:none}.ckr.all{font-size:1.05rem;color:var(--mut);border-bottom:2px solid var(--line)}
.jlist{background:#fff;border:1px solid var(--line);border-radius:.6rem;overflow:hidden}
#main .jr{display:grid;grid-template-columns:1.6rem minmax(4.5rem,1fr) auto 3rem 3.2rem 4.6rem 1.2rem;gap:.35rem;align-items:center;padding:.05rem .5rem;margin:0;border:0;border-bottom:1px solid #e2e8f0;border-radius:0;background:#fff;font-size:.92rem;min-height:1.55rem;box-shadow:none}
#main .jr.d2{grid-template-columns:1.6rem minmax(4.5rem,1fr) auto 3rem 3.2rem auto}
#main .jr.rd{grid-template-columns:minmax(4.5rem,1fr) 2.9rem 3.2rem 4rem auto;background:#f0fdf4}
#main.four .jr .tm,#main.four .jr .lg{display:none}#main.four .jr{grid-template-columns:1.3rem minmax(3.5rem,1fr) auto 2.8rem 3.8rem 1rem;font-size:.88rem}#main.four .jr.d2{grid-template-columns:1.4rem minmax(4.5rem,1fr) auto 3rem auto}#main.four .jr.rd{grid-template-columns:minmax(4.5rem,1fr) 2.7rem 3rem 3.6rem auto}
#main .jr.hd{background:#e2e8f0;font-size:.78rem;font-weight:800;color:#334155;min-height:1.4rem}
#main .jr:last-child{border-bottom:0}

#main .jr.drop{border-top:4px solid #f59e0b}#main .jr.dropb{border-bottom:4px solid #f59e0b}
.jr .no{font-weight:800;color:var(--mut);text-align:right;font-size:.85rem}

.jr .bx{font-weight:900;color:var(--kensa);text-align:right}
.jr .tm{color:var(--mut);font-size:.85rem}
.jr .t{font-weight:900}
.jr .rem{font-size:.85rem;white-space:nowrap}
.jr .bt{display:flex;gap:.3rem}
.tg{display:inline-block;font-size:.72rem;font-weight:800;border-radius:.3rem;padding:0 .35rem;margin-right:.3rem;vertical-align:middle}.tg.pz{background:#fef3c7;color:#92400e;border:1px solid #f59e0b}.tg.on1{background:#ede9fe;color:#5b21b6;border:1px solid #8b5cf6}
.btn.pause{background:#f59e0b;color:#111}
#kensaBody .job.jr{cursor:pointer}.jr .go{font-size:1.3rem;font-weight:900;color:var(--mut);text-align:center}
.ib{font-size:4.5rem;font-weight:900;line-height:1;color:var(--kensa);text-align:center}.ib small{font-size:1.6rem}
.isub{text-align:center;color:var(--mut);font-weight:700;margin:.3rem 0 .8rem}
.ibtns{display:grid;grid-template-columns:1fr 2fr;gap:.7rem}.ibtns .btn{min-height:5.2rem;font-size:1.7rem}
.btn.donebig{width:100%;min-height:4.4rem;font-size:1.7rem;margin-top:.7rem;background:var(--kensa)}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.4rem 0 .9rem}
.st3 .c{border:2px solid var(--line);border-radius:.9rem;text-align:center;padding:.4rem .2rem;color:#334155}
.st3 .c.on{border-color:var(--kensa);background:#f0fdf4;color:var(--kensa)}
.st3 span{display:block;font-weight:800;font-size:1.1rem}.st3 b{font-size:3.6rem;line-height:1.05;font-weight:900}.st3 small{font-size:1.3rem;font-weight:800}
.btn.red{background:#dc2626;color:#fff}
.rbtn{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.7rem}.rbtn .btn{min-height:4.2rem;font-size:1.3rem;line-height:1.2}.rbtn small{display:block;font-size:.9rem;font-weight:700;opacity:.9}
.hand{margin-top:.7rem;border:2px solid #dc2626;border-radius:.8rem;padding:.7rem;background:#fef2f2}
.reg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;align-items:stretch}
.reg .tp,.reg .rb{border:2px solid var(--line);border-radius:.9rem;padding:.4rem .5rem;display:flex;align-items:center;justify-content:center;gap:.35rem;flex-wrap:wrap}
.reg .tp>span,.reg .rb>span{width:100%;text-align:center;font-weight:800;color:#334155}
.reg .tp b{font-size:2rem}.reg .tp .btn{min-height:3rem;padding:0 .7rem;font-size:1.05rem}
.wh{height:7.2rem;width:4.4rem;overflow-y:auto;scroll-snap-type:y mandatory;border:2px solid #0f766e;border-radius:.6rem;scrollbar-width:none;
  background:linear-gradient(transparent 2.3rem,#ccfbf1 2.3rem,#ccfbf1 4.9rem,transparent 4.9rem)}
.wh::-webkit-scrollbar{display:none}
.wi{height:2.4rem;line-height:2.4rem;text-align:center;font-size:1.5rem;font-weight:800;color:#94a3b8;scroll-snap-align:center;cursor:pointer}
.wi.on{color:#0f172a;font-size:1.9rem;font-weight:900}
.reg .rb .fx{width:100%}
#iReg{min-height:auto;font-size:1.8rem}
.fix{margin-top:1rem;border-top:2px solid var(--line);padding-top:.8rem}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.5rem 0}.rs button{min-height:3.4rem;font-size:1.05rem;font-weight:800;border:2px solid var(--line);background:#fff;border-radius:.7rem;cursor:pointer}
.rs button.on{border-color:#b91c1c;background:#fee2e2;color:#991b1b}
.fx{display:grid;grid-template-columns:4rem 1fr 4rem;gap:.5rem;align-items:center}.fx .btn{min-height:3.6rem;font-size:1.6rem}.fx input{font-size:2rem;font-weight:900;text-align:center;width:100%}
.bxb{border:2px solid var(--kensa);background:#f0fdf4;color:var(--kensa);font-weight:900;border-radius:.4rem;padding:0 .3rem;min-height:1.35rem;font-size:.9rem;cursor:pointer;white-space:nowrap;text-align:right}

.qbtn{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:.8rem 0}.qbtn .btn{min-height:4rem;font-size:1.5rem}
#qIn{font-size:2.6rem;font-weight:900;width:100%;text-align:center}
.jr .btn{min-height:1.35rem;font-size:.8rem;padding:0 .45rem;border-radius:.4rem;white-space:nowrap}
.sum{gap:.3rem}.sum .s{font-size:.82rem;padding:.05rem .5rem;border-width:1px}.sum .s b{font-size:.95rem}

details.mk{background:#fff;border:2px solid var(--line);border-radius:.8rem;overflow:hidden;margin-bottom:.6rem}
details.mk summary{padding:.8rem 1rem;font-size:1.2rem;cursor:pointer;min-height:3rem;list-style-position:inside}
.mkc{color:var(--mut);font-size:.95rem;font-weight:600}
.it{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.5rem 1rem;border-top:1px solid #e2e8f0}
.it:has(.ck:checked){background:#ede9fe}
.it label{display:flex;align-items:center;gap:.7rem;font-size:1.15rem;font-weight:800;flex:1;flex-wrap:wrap}
.it .ck{width:2rem;height:2rem;flex:none}
.it small{color:var(--mut);font-weight:600;font-size:.9rem}
.it .q{white-space:nowrap;font-weight:700;color:var(--mut)}
.qty{width:6.5rem;font-size:1.3rem;text-align:right}

.pl:last-child{border:0}.pl.cur{background:var(--kake-bg)}
.pl .h{font-size:1.4rem;font-weight:900}.pl small{display:block;color:var(--mut)}
.pl .qn{font-weight:800;font-size:1.2rem}
.job .qp{color:#6d28d9;font-weight:800}
@media (max-width:900px){main.split{grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr)}main.split.four{grid-template-columns:repeat(3,minmax(0,1fr))}.job{grid-template-columns:2rem 5.5rem 1fr}.job .eta{grid-column:1/-1;text-align:left;display:flex;gap:.8rem;align-items:baseline}}
</style>

<body>
<div id="app">
  <header id="hdr">
    <h1>生産管理しくみ</h1>
    <span class="chip" id="hRole"></span>
    <span class="chip" id="hName"></span>
    <span class="chip" id="hNet"></span>
    <span class="chip" id="hMode" style="display:none">テストモード</span>
    <button class="ibtn" id="btnRef">更新</button>
    <span class="sp"></span>
    <span class="ver" id="hClock"></span>
    <button class="tab" data-view="main">画面</button>
    <button class="tab" data-view="jisseki">実績</button>
    <button class="ibtn andon" id="btnAndon">呼び出し</button>
    <button class="ibtn" id="btnFull">全画面</button>
    <button class="ibtn" id="btnSet">設定</button>
    <span class="ver">ver 2026-11-10</span>

  <main id="main">
    <section class="pane" id="paneDan1">
      <div class="panehead ph-dan" id="phDan1" style="display:none"></div>
      <div class="body"><div id="d1pick"></div><div class="sum"><span class="s" id="d1sum"></span></div><div id="d1rows"></div>
        <button class="btn sm" id="d1add">＋ 品番を追加</button>
        <div class="actions"><button class="btn ok" id="d1ok" disabled>送信（検査用段取りへ）</button></div>
        <div id="d1sent"></div></div>
    </section>
    <section class="pane" id="paneKake">
      <div class="panehead ph-kake" id="phKake" style="display:none">掛け作業場</div>
      <div class="scanbar"><span class="dot"></span><input id="scan" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ハンディスキャナーでQRを読む（ここにカーソル）"></div>
      <div class="body" id="kakeBody"></div>
    </section>
    <section class="pane" id="paneDan2">
      <div class="panehead ph-dan" id="phDan2" style="display:none"></div>
      <div class="sbar"><input id="q2" type="search" placeholder="品番・背番で検索" autocomplete="off" autocapitalize="characters"><button class="btn sm" data-qc="q2">×</button></div>
      <div class="body" id="dan2Body"></div>
    </section>
    <section class="pane" id="paneKensa">
      <div class="panehead ph-kensa" id="phKensa" style="display:none">検査場</div>
      <div class="sbar"><input id="q3" type="search" placeholder="品番・背番で検索" autocomplete="off" autocapitalize="characters"><button class="btn sm" data-qc="q3">×</button></div>
      <div class="body" id="kensaBody"></div>
    </section>
    <section class="pane" id="paneJisseki"><div class="body" id="jissekiBody"></div></section>
  </main>
</div>
<div id="modal"><div class="dlg" id="dlg"></div></div>
<div id="toast"><span id="toastMsg"></span><button id="toastUndo">取り消す</button></div>
<div id="andon"><h2>呼び出し</h2><div class="anl" id="anList"></div></div>
<div id="start"><div>画面をタッチして開始<div style="font-size:1.1rem;font-weight:600;margin-top:.8rem">（呼び出しの音を鳴らすために必要です）</div></div></div>
<div id="alarm"><h2>完了ボタンを押し忘れていませんか？</h2><p id="alarmMsg"></p><div class="row"><button class="btn fin" id="alarmFin">完了へ進む</button><button class="btn ghost" id="alarmSnooze">あとで（5分）</button></div></div>

<script>
'use strict';
/* ====== 基本 ====== */
const VER='2026-11-10';
/* Googleのウェブアプリから開いたとき（Code.gs の画面）は google.script.run でデータ置き場とやりとりする（URLの入力は不要） */
const onGas=typeof google==='object'&&!!(google.script&&google.script.run);
/* 配布用：ここにURLと合言葉が入っていると、ファイルを開くだけで本番（在庫カウントと同じ配り方）。
   リポジトリでは空のまま。設定 →「配布用ファイルをつくる」で入れたファイルを作る */
const PRESET={gasUrl:'',key:''};
const SRC=document.documentElement.outerHTML;   /* 配布用ファイルを作るための自分のコピー（画面を描く前に取る） */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const r2=x=>Math.round((+x||0)*100)/100;
const fn=x=>String(r2(x));
const remN=j=>Math.max(0,r2((+j.n||0)-(+j.ins||0)));   /* 検査の残り箱数 */
const hm=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())};
const ymd=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dur=sec=>{sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+pad(m):m)+':'+pad(s)};
const load=(k,d)=>{try{const v=localStorage.getItem('sk_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem('sk_'+k,JSON.stringify(v))}catch(e){}};

const DEFAULT_MASTER=[ /* 仮データ：品番マスタを取り込むと差し替わる（設定→品番マスタ。列：客先,名称,品番・背番） */
 {cust:'客先A',name:'プロテクター',hin:'19P'},{cust:'客先A',name:'ブラケット',hin:'47P'},{cust:'客先A',name:'カバー',hin:'3400'},
 {cust:'客先B',name:'バッテリーケース',hin:'4101'},{cust:'客先B',name:'ステー',hin:'3298'},{cust:'客先C',name:'パネル',hin:'5022'}];
const normM=m=>(m||[]).map(x=>{const o={cust:String(x.cust??x.maker??'').trim()||'未分類',name:String(x.name??'').trim(),hin:String(x.hin??'').trim(),sub:String(x.sub??'').trim(),pn:String(x.pn??'').trim(),kind:String(x.kind??'').trim()};
  return o}).filter(x=>x.hin||x.name).reduce((acc,o)=>{
  /* 前の版で取り込んだ「材料」「完成」別々のボタンは、1行＝1ボタン（材料）にまとめ直す */
  const k=!o.kind&&o.sub.match(/^(.*?)\s*(材料・完成|材料|完成)$/);
  if(k){const pn=k[1],kd=k[2],same=acc.find(x=>x.kind==='row'&&x.cust===o.cust&&x.pn===pn);
    if(same){if(kd!=='完成'){same.hin=o.hin}return acc}
    acc.push({cust:o.cust,name:'',hin:o.hin,pn,kind:'row',sub:pn});return acc}
  acc.push(o);return acc},[]);
const DEFSN=['段取り①+掛け','掛け','検査用段取り','検査'];  /* QR読取（掛け単独画面）はいったん中止。[1]は将来用に残す */
const SN=i=>(S.sn&&S.sn[i])||DEFSN[i];
const DEF={sn:DEFSN.slice(),name:'タブレット1',role:'kake',mode:onGas||PRESET.gasUrl?'live':'test',split:true,gasUrl:PRESET.gasUrl,key:PRESET.key,etaMin:180,idleMin:15,scale:100};
const firstRun=!load('settings',null);
let S=Object.assign({},DEF,load('settings',{}));
if(!S.gasUrl&&PRESET.gasUrl)S.gasUrl=PRESET.gasUrl;if(!S.key&&PRESET.key)S.key=PRESET.key;
if(S.sn&&S.sn[0]==='段取り①')S.sn[0]=DEFSN[0];
if(S.sn&&S.sn[2]==='段取り②')S.sn[2]=DEFSN[2];
if(S.role==='kake')S.role='dan1';
let master=normM(load('master',DEFAULT_MASTER));
let sess=load('sess',null);          // 掛け作業中：{hin,sei,kb:[{s,e,q}]}
let view='main';
let jobs={};                          // id -> job
let online=true, warn=null, warnTimer=null, alarmOn=false, snoozeUntil=0, alarmTimer=null, modalOpen=false;

const live=()=>S.mode==='live';
const jobsKey=()=>'jobs_'+S.mode;
const sp4=()=>S.mode==='test'&&S.split;
const showDan1=()=>sp4()||S.role==='dan1';
const showKake=()=>false;   /* QR読取はいったん中止（全部ハンド入力） */
const showDan2=()=>sp4()||S.role==='dan2';
const showKensa=()=>sp4()||S.role==='kensa';
const stg=j=>j.stage??3;
const planned=()=>Object.values(jobs).filter(j=>stg(j)===1&&j.st==='wait').sort((a,b)=>a.tp-b.tp);
const stNum=st=>({wait:0,ready:1,done:2}[st]);

/* ====== 音 ====== */
let ac=null;
function unlockAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function beep(freq=880,d=.15,times=1){if(!ac)return;for(let i=0;i<times;i++){const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=freq;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+i*(d+.08);g.gain.setValueAtTime(.25,t);o.start(t);o.stop(t+d)}}
document.addEventListener('pointerdown',unlockAudio);document.addEventListener('keydown',unlockAudio);

/* ====== データ置き場（差し替え可能：ローカル / Googleスプレッドシート） ====== */
function loadJobs(){jobs=load(jobsKey(),{});const lim=Date.now()-2*864e5;for(const id in jobs){if((jobs[id].st==='done'||jobs[id].st==='cancel')&&(jobs[id].td||jobs[id].t1||jobs[id].tp||0)<lim)delete jobs[id]}}
function saveJobs(){save(jobsKey(),jobs)}
const outbox=()=>load('outbox',{});
let flushing=false;
function upsert(job){
  job.u=Date.now();jobs[job.id]=job;saveJobs();
  if(live()){const ob=outbox();ob[job.id]=job;save('outbox',ob);flush()}
  renderAll();
}
async function gas(method,params,body){
  if(onGas){
    const req=body?{body:Object.assign({key:S.key||''},body)}:{params:Object.assign({key:S.key||''},params||{})};
    const j=JSON.parse(await new Promise((ok,ng)=>google.script.run.withSuccessHandler(ok).withFailureHandler(ng).api(req)));
    if(!j.ok)throw new Error(j.error||'error');return j;
  }
  const url=S.gasUrl.trim();if(!url)throw new Error('no url');
  const u=new URL(url);u.searchParams.set('key',S.key||'');if(params)for(const k in params)u.searchParams.set(k,params[k]);
  if(body)body=Object.assign({key:S.key||''},body);
  const r=await fetch(u.toString(),body?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'}:{redirect:'follow'});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'error');return j;
}
async function flush(){
  if(!live()||flushing)return;const ob=outbox(),ids=Object.keys(ob);
  if(!ids.length)return;   /* 送るものがないときは表示を変えない（つながっているかは受信で判断する） */
  flushing=true;
  try{
    await gas('POST',null,{action:'upsert',jobs:ids.map(i=>ob[i])});
    const now=outbox();ids.forEach(i=>{if(now[i]&&now[i].u===ob[i].u)delete now[i]});save('outbox',now);setNet(true);
  }catch(e){setNet(false)}
  flushing=false;
}
async function poll(){
  if(!live())return;
  try{
    const j=await gas('GET',{action:'list'});const ob=outbox();let ch=false;
    for(const x of j.jobs){if(ob[x.id])continue;const c=jobs[x.id];if(!c||x.u>c.u){jobs[x.id]=x;ch=true}}
    if(ch){saveJobs();renderAll()}setNet(true);
  }catch(e){setNet(false)}
}
async function fetchMaster(){
  try{const j=await gas('GET',{action:'master'});if(j.master&&j.master.length){master=normM(j.master);save('master',master);d1Built=false;return true}}catch(e){}
  return false;
}
let andonLog=[];
async function listByDate(date){
  const mine=()=>Object.values(jobs).filter(j=>j.t1&&stg(j)>=2&&stg(j)<9&&ymd(j.t1)===date);
  andonLog=Object.values(jobs).filter(j=>stg(j)===9&&ymd(j.tp)===date);
  if(!live())return mine();
  try{const j=await gas('GET',{action:'list',date});setNet(true);andonLog=j.jobs.filter(x=>stg(x)===9);return j.jobs.filter(x=>x.t1&&stg(x)>=2&&stg(x)<9)}catch(e){setNet(false);return mine()}
}
function setNet(ok){online=ok;renderHeader()}
window.addEventListener('online',()=>{flush();poll()});
window.addEventListener('storage',e=>{if(e.key==='sk_'+jobsKey()){loadJobs();renderAll()}if(e.key==='sk_sess'){sess=load('sess',null);renderKake()}});

/* ====== QR ====== */
/* QRの中身は同品番で全て同じ文字列。受領サンプル3種に対応（全角は半角にそろえてから判定）：
   形式1  AAA,77272-60080,113,30      → 2番目が品番
   形式2  AAA,74043-60020,A0U0,3      → 2番目が品番
   形式3  ＠＞066V…P17526-11010Q12…  → 「P」＋ ddddd-ddddd が品番
   背番号はQRからは確定できないため、品番マスタ（協豊背番号）を引く。 */
const TEST_QR=['AAA,77272-60080,113,30','AAA,74043-60020,A0U0,3',
 '＠＞066V054611V020L2L400138990 4    1L8K7V400138990 4    9K20 116D202611069D0110KR7638020P 33P17526-11010Q12P017K20Ｚ０６３３５１２９９４４８Ｋ０５４６０　　０２５２０　００００００　　　　　　　　　　　　　　　　　　　　　　　　　　　　００００００００　　　　　　０　　　　　　　　Ｅ'];
function parseQR(raw){
  const s=raw.normalize('NFKC').trim();
  let hin=null,m;
  if((m=s.match(/^AAA,([^,]+),/)))hin=m[1].trim();
  else if((m=s.match(/P(\d{5}-\d{5})/)))hin=m[1];
  else if((m=s.match(/\d{5}-\d{5}/)))hin=m[0];
  const mm=master.find(x=>x.hin===(hin||s))||(!hin&&master.find(x=>x.hin&&s.includes(x.hin)));
  return {hin:mm?mm.hin:(hin||s),sei:mm?mm.sei:'',known:!!mm};
}
function setWarn(title,msg,bad){
  warn={title,msg,bad};beep(bad?440:660,.25,bad?3:2);renderKake();
  clearTimeout(warnTimer);warnTimer=setTimeout(()=>{warn=null;renderKake()},7000);
}
function clearWarn(){warn=null;clearTimeout(warnTimer)}

function handleScan(raw){
  raw=(raw||'').trim();if(!raw)return;
  const now=Date.now();
  const q=parseQR(raw);
  if(sess&&nh(sess.hin)!==nh(q.hin)){setWarn('別の品番です','いまの品番（'+sess.hin+'）を完了してから読んでください。',true);return}
  const pj=sess?jobs[sess.jobId]:planned().find(j=>nh(j.hin)===nh(q.hin));
  if(!sess&&!pj){setWarn('生産予定にない品番です',q.hin+'　→ '+SN(0)+'で選ぶか、手入力（特別対応）で追加してください。',true);return}
  addKanban({hin:pj?pj.hin:q.hin,sei:(pj&&pj.sei)||q.sei,jobId:pj?pj.id:null},false,false);
}
function addKanban(q,qrless,unknown){
  const now=Date.now();
  if(!sess)sess={hin:q.hin,sei:q.sei,jobId:q.jobId||null,kb:[],t0:now};
  sess.kb.push({s:now,e:null,q:qrless?1:0});
  clearWarn();stopAlarm();save('sess',sess);
  if(unknown)setWarn('品番マスタに無いQRです','読取は数えました。QR文字列：'+q.hin,false);
  else{beep(1200,.08,1);renderKake()}
}
function unplan(id){const j=jobs[id];if(!j)return;
  openModal(`<h3>生産予定から外しますか？</h3><div class="big">${esc(j.hin)}</div><div class="foot"><button class="btn ghost" data-close>もどる</button><button class="btn end" id="okU">外す</button></div>`,()=>{$('#okU').onclick=()=>{closeModal();j.st='cancel';upsert(j)}});}
function cancelLast(){if(!sess)return;const k=sess.kb[sess.kb.length-1];if(!k)return;sess.kb.pop();if(!sess.kb.length)sess=null;save('sess',sess);renderKake()}
function discardSess(){sess=null;save('sess',null);stopAlarm();renderKake()}

function confirmFinish(){
  if(!sess||!sess.kb.length)return;
  stopAlarm();
  const n=sess.kb.length;
  openModal(`<h3>完了してよいですか？</h3><div class="big">${esc(sess.hin)}</div><div class="big" style="color:var(--kake)">${n} 枚</div>
  <div class="foot"><button class="btn ghost" data-close>もどる</button><button class="btn fin" id="okFin">完了する</button></div>`,()=>{
    $('#okFin').onclick=()=>{closeModal();finish()};
  });
}
function finish(){
  const now=Date.now(),kb=sess.kb;
  let job=sess.jobId&&jobs[sess.jobId];
  if(!job)job={id:S.name+'-'+kb[0].s+'-'+Math.random().toString(36).slice(2,6),hin:sess.hin,sei:sess.sei,maker:'',qty:null,tp:now};
  Object.assign(job,{tab:S.name,n:kb.length,nq:kb.filter(k=>k.q).length,t0:kb[0].s,t1:now,eta:now+S.etaMin*60000,st:'wait',stage:2,kb:kb.map(k=>[k.s,null,k.q])});
  sess=null;save('sess',null);clearWarn();stopAlarm();
  upsert(job);toast(job.hin+' '+job.n+'枚 を'+SN(2)+'へ送りました');
}
function pickQrless(){
  openModal(`<h3>QRなし入力（生産予定から選ぶ）</h3><input id="pq" placeholder="品番・背番号をしぼりこみ" style="width:100%"><div class="pick" id="pl"></div><div class="foot"><button class="btn ghost" data-close>もどる</button></div>`,()=>{
    const L=planned().map(j=>({hin:j.hin,sei:j.sei,name:j.qty!=null?'箱数 '+j.qty:'',id:j.id}));
    const draw=()=>{const f=$('#pq').value.trim().toLowerCase();
      $('#pl').innerHTML=L.filter(m=>!f||(m.hin+' '+m.sei+' '+(m.name||'')).toLowerCase().includes(f)).slice(0,60)
        .map(m=>`<button data-hin="${esc(m.hin)}">${esc(m.hin)}<small>背番号 ${esc(m.sei)} ${esc(m.name||'')}</small></button>`).join('')||'<div class="empty">該当なし</div>'};
    draw();$('#pq').oninput=draw;
    $('#pl').onclick=e=>{const b=e.target.closest('button[data-hin]');if(!b)return;const m=L.find(x=>x.hin===b.dataset.hin);
      if(sess&&sess.hin!==m.hin){closeModal();setWarn('別の品番です','いまの品番（'+sess.hin+'）を完了してから選んでください。',true);return}
      closeModal();addKanban({hin:m.hin,sei:m.sei,jobId:m.id},true,false)};
  });
}

/* ====== 段取り①：生産する品番をハンド入力（品番・背番・箱数） ====== */
let plan=load('plan3',[{hin:'',box:''}]),d1Built=false;
const nh=x=>String(x??'').normalize('NFKC').trim().toUpperCase();
function savePlan(){save('plan3',plan)}
/* 検索：品番・背番の一部で絞り込む（全角半角・大小文字はそろえて比べる） */
const qv=id=>nh(($('#'+id)||{}).value||'');
const hitQ=(j,q)=>!q||nh(j.hin).includes(q)||nh(j.sei||'').includes(q);
/* 客先名はスペースや（ ）の前で改行して、1〜2文字だけ次の行に送られないようにする */
const cuLabel=c=>String(c).trim().replace(/（/g,' （').split(/[\s\u3000]+/).filter(Boolean).map(x=>`<span class="ln">${esc(x)}</span>`).join('');
let pickCust=null;
function renderPick(){
  const el=$('#d1pick');if(!el)return;
  if(!master.length){el.innerHTML='';return}
  const custs=[...new Set(master.map(m=>m.cust))];
  if(pickCust&&!custs.includes(pickCust))pickCust=null;
  el.innerHTML=!pickCust

function pickItem(h){

function d1Valid(){return plan.filter(p=>nh(p.hin))}
function updDan1(){

function renderDan1(){if(!showDan1()||view!=='main')return;if(!d1Built)buildDan1();else updDan1()}
function addRow(){plan.push({hin:'',box:''});savePlan();buildDan1(true)}
function confirmPlan(){
  const v=d1Valid();if(!v.length)return;
  const seen={};for(const p of v){const k=nh(p.hin);if(seen[k]){alert('品番「'+p.hin+'」が2回入っています');return}seen[k]=1}
  if(v.length===1){   /* 1品番だけなら確認なしですぐ送信（9秒間は取り消し可） */
    const p=v[0];if(!(+p.box>=1)||!Number.isInteger(+p.box)){alert('「'+p.hin+'」の箱数（かんばん枚数）を入力してください');return}
    promotePlan([p]);return}
  openModal(`<h3>${esc(SN(2))}へ送る品番を選んでください</h3>
   <label class="ckr all"><input type="checkbox" id="ckAll" checked>すべて選ぶ／はずす</label>
   ${v.map(p=>`<label class="ckr"><input type="checkbox" class="ckp" data-i="${plan.indexOf(p)}" checked>${esc(p.hin)}　${p.box===''?'<span style="color:var(--bad)">箱数なし</span>':(+p.box)+'箱'}</label>`).join('')}
   <div class="foot"><button class="btn ghost" data-close>もどる</button><button class="btn ok" id="okP"></button></div>`,()=>{
    const cks=()=>[...document.querySelectorAll('.ckp')];
    const upd=()=>{const n=cks().filter(c=>c.checked).length;$('#okP').textContent='選んだ '+n+' 品番を送信';$('#okP').disabled=!n;$('#ckAll').checked=n===cks().length};
    $('#ckAll').onchange=e=>{cks().forEach(c=>c.checked=e.target.checked);upd()};
    cks().forEach(c=>c.onchange=upd);upd();
    $('#okP').onclick=()=>{
      const ch=cks().filter(c=>c.checked).map(c=>plan[+c.dataset.i]);
      const bad=ch.find(p=>!(+p.box>=1)||!Number.isInteger(+p.box));
      if(bad){alert('「'+bad.hin+'」の箱数（かんばん枚数）を入力してください');return}
      closeModal();promotePlan(ch)}});
}
function promotePlan(v){
  const now=Date.now(),back=JSON.parse(JSON.stringify(plan)),ids=[];
  v.forEach((p,i)=>{const n=+p.box,id='H-'+S.name+'-'+now+'-'+i+'-'+Math.random().toString(36).slice(2,5);ids.push(id);
    upsert({id,tab:S.name,hin:p.hin.normalize('NFKC').trim(),sei:'',maker:'',qty:n,n,nq:n,ins:0,t0:p.t0||now,t1:now,eta:now+S.etaMin*60000,stage:2,st:'wait',tp:now,kb:[]})});
  plan=plan.filter(p=>!v.includes(p)&&(nh(p.hin)||p.box!==''));if(!plan.length)plan=[{hin:'',box:''}];savePlan();buildDan1();
  toast(v.length+'品番を'+SN(2)+'へ送りました',()=>{ids.forEach(id=>{const j=jobs[id];if(j){j.st='cancel';upsert(j)}});plan=back;savePlan();buildDan1()});
}

/* ====== 検査場の操作 ====== */
/* 数量の変更（検査用段取り＝箱数 / 検査＝残り箱数）。完成箱が足りない・不良で端数が出るときに使う */
function openQty(id,mode){
  const j=jobs[id];if(!j)return;
  const cur=mode==='kensa'?remN(j):r2(j.n);
  openModal(`<h3>${mode==='kensa'?'残り箱数を変更':'箱数を変更'}</h3><div class="big">${esc(j.hin)}</div>
    <div style="color:var(--mut)">送信時 ${fn(j.qty??j.n)}箱${mode==='kensa'?'　／　検査済み '+fn(j.ins||0)+'箱':''}</div>
    <input id="qIn" type="number" min="0" step="1" inputmode="numeric" value="${cur}" style="margin-top:.6rem">
    <div class="qbtn">${[-1,1].map(d=>`<button class="btn ghost" data-q="${d}">${d>0?'+':'−'}${Math.abs(d)}</button>`).join('')}</div>
    <div class="foot"><button class="btn ghost" data-close>もどる</button><button class="btn ok" id="qOk">決定</button></div>`,()=>{
    document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#qIn').value=Math.max(0,r2((+$('#qIn').value||0)+(+b.dataset.q)))});
    $('#qOk').onclick=()=>{
      const v=r2($('#qIn').value);
      if($('#qIn').value===''||isNaN(v)||v<0||!Number.isInteger(v)){alert('0以上の整数を入れてください');return}
      if(mode!=='kensa'&&v<=0){alert('0より大きい数を入れてください（やめる場合は検査完了・取消で）');return}
      const prev=JSON.parse(JSON.stringify(j));
      if(mode==='kensa'){j.n=r2((+j.ins||0)+v);if(v===0){j.st='done';j.td=Date.now()}}else j.n=v;
      closeModal();upsert(j);
      toast(j.hin+'：'+(mode==='kensa'?'残り ':'')+fn(v)+'箱'+(j.st==='done'?'（検査完了）':''),()=>{prev.u=Date.now();jobs[prev.id]=prev;upsert(prev)});
    };
  });
}
/* ====== 検査の詳細（品番をタップ） ======
   「検査終了（1箱）」を押すたびに残りが1ずつ減る → 0になったら「完了」。
   数が合わないときは理由（不良が出た／前工程の数量が違う／ハンド入力）を選んで自分で修正。修正は記録に残す（adj）。 */
const FIXR=['不良','前工程の数が違う','ハンド入力'];
let insp=null;   // {id, hand:false, val, hist:[]}
function openInsp(id){const j0=jobs[id];if(j0&&j0.pz){j0.pz=null;upsert(j0)}const nd=new Date();insp={id,hand:false,val:null,hist:[],open:Date.now(),si:null,t:{sH:nd.getHours(),sM:nd.getMinutes(),eH:nd.getHours(),eM:nd.getMinutes()},bx:null};openModal('<div id="inspBox"></div>',drawInsp)}
function inspDo(fn){const j=jobs[insp.id],prev=JSON.parse(JSON.stringify(j));insp.hist.push(prev);fn(j);
  if(remN(j)<=0&&j.st==='wait'){j.st='done';j.td=Date.now();upsert(j);closeModal();
    setTimeout(()=>toast('検査完了：'+j.hin+'（のこり0）',()=>{prev.u=Date.now();jobs[prev.id]=prev;upsert(prev)}),50);return true}
  upsert(j);drawInsp();return false}
function drawInsp(){
  const j=jobs[insp.id],box=$('#inspBox');if(!j||!box){closeModal();return}
  const r=remN(j);if(insp.bx==null||insp.bx>r)insp.bx=r;
  box.innerHTML=`<h3>${esc(j.hin)}　<span style="font-size:1rem;color:var(--mut)">到着予定 ${hm(j.eta)}　送信 ${fn(j.qty??j.n)}箱</span></h3>
    <div class="st3"><div class="c on"><span>のこり</span><b>${fn(r)}</b><small>箱</small></div><div class="c"><span>検査済み</span><b>${fn(j.ins||0)}</b><small>箱</small></div><div class="c"><span>全体</span><b>${fn(j.n)}</b><small>箱</small></div></div>
    <div class="reg">
      <div class="tp"><span>検査開始</span><div class="wh" data-k="sH"></div><b>:</b><div class="wh" data-k="sM"></div><button class="btn ghost" data-now="s">今</button></div>
      <div class="tp"><span>検査終了</span><div class="wh" data-k="eH"></div><b>:</b><div class="wh" data-k="eM"></div><button class="btn ghost" data-now="e">今</button></div>
      <div class="rb"><span>処理した箱数</span><div class="fx"><button class="btn ghost" data-bx="-1">−1</button><input id="iBx" type="number" min="1" step="1" inputmode="numeric" value="${insp.bx}"><button class="btn ghost" data-bx="1">+1</button></div></div>
      <button class="btn insp" id="iReg" ${r>0?'':'disabled'}>登録する</button>
    </div>
    <div class="rbtn">${FIXR.map(x=>`<button class="btn red" data-fr="${esc(x)}" ${x!=='ハンド入力'&&r<=0?'disabled':''}>${esc(x)}${x!=='ハンド入力'?'<small>−1箱</small>':'<small>数を直す</small>'}</button>`).join('')}</div>
    ${insp.hand?`<div class="hand"><b>ハンド入力：正しい のこり箱数</b>
      <div class="fx"><button class="btn ghost" data-fv="-1">−1</button><input id="iVal" type="number" min="0" step="1" inputmode="numeric" value="${insp.val}"><button class="btn ghost" data-fv="1">+1</button></div>
      <input id="iMemo" placeholder="コメント（例：数え直し、箱の入れ違い など）" value="${esc(insp.memo||'')}" style="width:100%;margin-top:.6rem;font-size:1.2rem">
      <div class="foot"><button class="btn ghost" id="hCan">やめる</button><button class="btn red" id="hOk">反映する</button></div></div>`:''}
    <div class="foot"><button class="btn pause" id="iPause" ${r>0?'':'disabled'}>一時中断（あとで続ける）</button><button class="btn ghost" data-close>とじる</button></div>`;
  $('#iPause').onclick=()=>{const now=Date.now();if(insp.si!=null&&j.ses&&j.ses[insp.si])j.ses[insp.si][1]=now;j.pz=now;j.paus=(j.paus||[]).concat([[now,S.name]]);closeModal();upsert(j);toast(j.hin+'：一時中断（のこり '+fn(r)+'箱）')};
  /* 時間はクルクル（ホイール）で設定。処理した箱数を入れて登録 → のこりが減る */
  box.querySelectorAll('.wh').forEach(w=>{const k=w.dataset.k,max=k.endsWith('H')?23:59;
    w.innerHTML='<div class="wi"></div>'+Array.from({length:max+1},(_,v)=>`<div class="wi">${pad(v)}</div>`).join('')+'<div class="wi"></div>';
    const mark=()=>w.querySelectorAll('.wi').forEach((x,i)=>x.classList.toggle('on',i-1===insp.t[k]));
    requestAnimationFrame(()=>{w.scrollTop=insp.t[k]*w.children[1].offsetHeight;mark()});
    let tm=null;w.addEventListener('scroll',()=>{clearTimeout(tm);tm=setTimeout(()=>{const ih=w.children[1].offsetHeight;
      insp.t[k]=Math.max(0,Math.min(max,Math.round(w.scrollTop/ih)));mark()},90)});
    w.addEventListener('click',e=>{const it=e.target.closest('.wi');if(!it||!it.textContent)return;insp.t[k]=+it.textContent;w.scrollTo({top:insp.t[k]*it.offsetHeight,behavior:'smooth'});mark()});
  });
  box.querySelectorAll('[data-now]').forEach(b=>b.onclick=()=>{const d=new Date(),p=b.dataset.now;insp.t[p+'H']=d.getHours();insp.t[p+'M']=d.getMinutes();drawInsp()});
  box.querySelectorAll('[data-bx]').forEach(b=>b.onclick=()=>{insp.bx=Math.max(1,Math.min(r,(+$('#iBx').value||0)+(+b.dataset.bx)));$('#iBx').value=insp.bx});
  $('#iBx').oninput=e=>insp.bx=+e.target.value;
  $('#iReg').onclick=()=>{
    const bx=+$('#iBx').value,d0=new Date();d0.setSeconds(0,0);
    const st=new Date(d0).setHours(insp.t.sH,insp.t.sM),en=new Date(d0).setHours(insp.t.eH,insp.t.eM);
    if(en<st){alert('検査終了の時間が、検査開始より前になっています');return}
    if(!Number.isInteger(bx)||bx<1){alert('処理した箱数を1以上で入れてください');return}
    if(bx>r){alert('のこり '+fn(r)+'箱より多いです。数が違うときは「ハンド入力」で直してください');return}
    const prev=JSON.parse(JSON.stringify(j));
    if(inspDo(j=>{j.ins=(+j.ins||0)+bx;j.tab3=S.name;j.ses=(j.ses||[]).concat([[st,en,bx]])}))return;
    insp.t.sH=insp.t.eH;insp.t.sM=insp.t.eM;insp.bx=null;drawInsp();beep(1500,.08,1);
    toast(j.hin+'：'+hm(st)+'～'+hm(en)+'　'+bx+'箱を登録しました',()=>{prev.u=Date.now();jobs[prev.id]=prev;upsert(prev);if($('#inspBox'))drawInsp()});
  };
  box.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>{
    const x=b.dataset.fr;
    if(x==='ハンド入力'){insp.hand=!insp.hand;insp.val=r;insp.memo='';drawInsp();return}
    if(inspDo(j=>{j.n=(+j.n||0)-1;j.adj=(j.adj||[]).concat([[Date.now(),-1,x,'',S.name]])}))return;beep(500,.12,1);toast(j.hin+'：'+x+'　−1箱（記録しました）');
  });
  if(insp.hand){
    box.querySelectorAll('[data-fv]').forEach(b=>b.onclick=()=>{insp.val=Math.max(0,(+$('#iVal').value||0)+(+b.dataset.fv));$('#iVal').value=insp.val});
    $('#iVal').oninput=e=>insp.val=+e.target.value;
    $('#iMemo').oninput=e=>insp.memo=e.target.value;
    $('#hCan').onclick=()=>{insp.hand=false;insp.memo='';drawInsp()};
    $('#hOk').onclick=()=>{const v=+$('#iVal').value;
      if(!Number.isInteger(v)||v<0){alert('0以上の整数を入れてください');return}
      const d=v-r,memo=($('#iMemo').value||'').trim();if(!d){alert('のこり箱数が同じです。数を直してから反映してください');return}
      insp.hand=false;insp.memo='';if(inspDo(j=>{j.n=(+j.n||0)+d;j.adj=(j.adj||[]).concat([[Date.now(),d,'ハンド入力',memo,S.name]])}))return;toast(j.hin+'：ハンド入力 '+(d>0?'+':'')+d+'箱'+(memo?'（'+memo+'）':'')+'　記録しました')};
  }

}

/* 検査：1箱ずつ減らす（山積みからカウントダウン）。残りが0になったら検査完了 */

function downloadMasterTpl(){

function masterFromRows(rows){
  /* 掛け置き「管理シート」形式：メーカー＝客先、材料・完成＝品番・背番（同じなら1つだけ） */
  const hi=rows.findIndex(r=>r&&r.some(c=>String(c).trim()==='メーカー')&&r.some(c=>String(c).trim()==='材料')&&r.some(c=>String(c).trim()==='完成'));
  if(hi>=0){
    const H=rows[hi].map(c=>String(c||'').trim()),cM=H.indexOf('メーカー'),cP=H.indexOf('品番'),cA=H.indexOf('材料'),cK=H.indexOf('完成'),out=[],seen=new Set();
    rows.slice(hi+1).forEach(r=>{if(!r)return;const mk=String(r[cM]||'').trim();if(!mk)return;
      const pn=cP>=0?String(r[cP]||'').trim():'',a=String(r[cA]||'').trim(),k=String(r[cK]||'').trim();
      /* 1行＝1ボタン：上に材料、下に品番。押すと「品番・背番」に材料が入る（材料が空なら完成） */
      const h=a||k;if(!h)return;const key=mk+'|'+h+'|'+pn;if(seen.has(key))return;seen.add(key);
      out.push({cust:mk,name:'',hin:h,pn,kind:'row',sub:pn})});
    return normM(out);
  }
  return normM(rows.filter(r=>r&&(r[0]||r[1]||r[2])).filter((r,i)=>!(i===0&&/客先/.test(String(r[0])))).map(r=>({cust:r[0]||'',name:r[1]||'',hin:r[2]||''})));
}
async function readTable(f){
  const buf=await f.arrayBuffer();
  if(/\.xlsx$/i.test(f.name))return readXlsx(buf);
  let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(x){t=new TextDecoder('shift_jis').decode(buf)}
  return t.replace(/^\uFEFF/,'').split(/\r?\n/).map(l=>l.split(/,|\t/).map(x=>x.trim().replace(/^"|"$/g,'')));
}
async function readXlsx(buf){   /* ライブラリなしで .xlsx の1枚目のシートを読む */
  const u8=new Uint8Array(buf),dv=new DataView(buf),dec=new TextDecoder();
  let e=-1;for(let i=u8.length-22;i>=0;i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error('Excelファイルではありません');
  const files={};let p=dv.getUint32(e+16,true);const n=dv.getUint16(e+10,true);
  for(let k=0;k<n;k++){const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    files[dec.decode(u8.subarray(p+46,p+46+nl))]={m,cs,lo};p+=46+nl+xl+cl}
  const get=async name=>{const f=files[name];if(!f)return null;const nl=dv.getUint16(f.lo+26,true),xl=dv.getUint16(f.lo+28,true),d=u8.subarray(f.lo+30+nl+xl,f.lo+30+nl+xl+f.cs);
    if(f.m===0)return dec.decode(d);
    return await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()};
  const X=t=>new DOMParser().parseFromString(t,'application/xml');
  const ssT=await get('xl/sharedStrings.xml'),ss=ssT?[...X(ssT).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].filter(t=>t.parentNode.localName!=='rPh').map(t=>t.textContent).join('')):[];   /* ふりがな(rPh)は除く */
  let sheet=null;
  try{const wb=X(await get('xl/workbook.xml')),rl=X(await get('xl/_rels/workbook.xml.rels'));
    const rel={};[...rl.getElementsByTagName('Relationship')].forEach(r=>rel[r.getAttribute('Id')]=r.getAttribute('Target'));
    const sh=[...wb.getElementsByTagName('sheet')].map(e=>({n:e.getAttribute('name')||'',t:rel[e.getAttribute('r:id')||e.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')]}));
    const hit=sh.find(x=>/^管理シート/.test(x.n))||sh.find(x=>/品番マスタ/.test(x.n))||sh[0];
    if(hit&&hit.t)sheet=hit.t.replace(/^\/?(xl\/)?/,'xl/');}catch(x){}
  if(!sheet||!files[sheet])sheet=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/)))[0];
  if(!sheet)throw new Error('シートが見つかりません');
  const doc=X(await get(sheet)),out=[];
  [...doc.getElementsByTagName('row')].forEach(row=>{const r=[];[...row.getElementsByTagName('c')].forEach(c=>{
    const ref=c.getAttribute('r')||'',col=[...ref.replace(/\d/g,'')].reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1,t=c.getAttribute('t');
    const v=c.getElementsByTagName('v')[0],is=c.getElementsByTagName('t');
    r[col<0?r.length:col]=t==='s'?(ss[+(v&&v.textContent)]||''):t==='inlineStr'?[...is].filter(x=>x.parentNode.localName!=='rPh').map(x=>x.textContent).join(''):(v?v.textContent:'')});
    out[(+row.getAttribute('r')||out.length+1)-1]=[...r].map(x=>x==null?'':String(x).trim())});
  return out.filter(Boolean);
}

function siren(){  /* 工場の騒音（低い音）に負けない高めの2音を交互に。最大音量・矩形波 */
  if(!ac)return;
  try{
    if(!ac._cmp){ac._cmp=ac.createDynamicsCompressor();ac._cmp.threshold.value=-10;ac._cmp.ratio.value=4;ac._cmp.connect(ac.destination)}
    const t0=ac.currentTime;
    [[2000,0],[1300,.35],[2000,.7],[1300,1.05]].forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(ac._cmp);
      g.gain.setValueAtTime(1,t0+d);g.gain.setValueAtTime(0,t0+d+.33);o.start(t0+d);o.stop(t0+d+.34)});
  }catch(e){}
  if(navigator.vibrate)navigator.vibrate([300,100,300]);
}

function endDrag(commit){
  const d=drag;if(!d)return;clearTimeout(d.t);drag=null;if(!d.on)return;
  lastDragEnd=Date.now();d.c.classList.remove('drag');d.c.style.transform='';
  document.querySelectorAll('.job.drop,.job.dropb').forEach(x=>x.classList.remove('drop','dropb'));
  if(commit&&d.ni!=null){
    const ids=Object.values(jobs).filter(j=>j.st==='wait'&&stg(j)===3).sort(byOrder).map(j=>j.id).filter(x=>x!==d.id);
    ids.splice(d.ni,0,d.id);
    ids.forEach((id,k)=>{if(jobs[id].ord!==k){jobs[id].ord=k;upsert(jobs[id])}});
    toast('順番を入れ替えました');
  }
  renderKensa();
}
const kb_=$('#kensaBody');
kb_.addEventListener('pointerdown',e=>{
  const c=e.target.closest('.job');if(!c||e.target.closest('button')||qv('q3'))return;
  const d={c,id:c.dataset.id,x:e.clientX,y:e.clientY,on:false,ni:null};drag=d;
  d.t=setTimeout(()=>{d.on=true;c.classList.add('drag');try{c.setPointerCapture(e.pointerId)}catch(x){}if(navigator.vibrate)navigator.vibrate(30)},500);
});
kb_.addEventListener('pointermove',e=>{
  const d=drag;if(!d)return;
  if(!d.on){if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>12){clearTimeout(d.t);drag=null}return}
  e.preventDefault();d.c.style.transform='translateY('+(e.clientY-d.y)+'px)';
  const{i,others}=dropIndex(d,e.clientY);d.ni=i;
  others.forEach(o=>o.classList.remove('drop','dropb'));
  if(others[i])others[i].classList.add('drop');else if(others.length)others[others.length-1].classList.add('dropb');
});
kb_.addEventListener('pointerup',()=>endDrag(true));
kb_.addEventListener('pointercancel',()=>endDrag(false));
kb_.addEventListener('contextmenu',e=>{if(e.target.closest('.job'))e.preventDefault()});
document.addEventListener('touchmove',e=>{if(drag&&drag.on)e.preventDefault()},{passive:false});
$('#paneDan1').addEventListener('input',e=>{
  const row=e.target.closest('.hr');if(!row)return;const p=plan[+row.dataset.i];if(!p)return;
  if(!p.t0)p.t0=Date.now();
  if(e.target.classList.contains('f-hin'))p.hin=e.target.value;else if(e.target.classList.contains('f-box'))p.box=e.target.value;
  savePlan();updDan1();
});
$('#paneDan1').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;const t=e.target;if(!t.closest('.hr'))return;e.preventDefault();
  const row=t.closest('.hr');
  if(t.classList.contains('f-hin'))row.querySelector('.f-box').focus();
  else if(t.classList.contains('f-box')){if(row.matches(':last-child')&&nh(plan[+row.dataset.i].hin))addRow();else{const nx=row.nextElementSibling;if(nx)nx.querySelector('.f-hin').focus()}}
});
$('#paneDan1').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');if(!d)return;
  plan.splice(+d.dataset.del,1);if(!plan.length)plan.push({hin:'',box:''});savePlan();buildDan1();
});
$('#d1pick').addEventListener('click',e=>{const c=e.target.closest('[data-cu]'),k=e.target.closest('[data-pk]');
  if(c){pickCust=c.dataset.cu||null;renderPick()}else if(k)pickItem(k.dataset.pk)});
$('#d1add').onclick=addRow;$('#d1ok').onclick=confirmPlan;
$('#paneDan2').addEventListener('click',e=>{const b=e.target.closest('button[data-adv],button[data-ed]');if(!b)return;const id=b.closest('[data-id]').dataset.id;if(b.dataset.ed)openQty(id,'dan2');else advance(id)});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;layout();renderHeader();if(view==='jisseki')renderJisseki();else renderAll()});
$('#btnSet').onclick=openSettings;
$('#q2').addEventListener('input',renderDan2);$('#q3').addEventListener('input',renderKensa);
document.querySelectorAll('[data-qc]').forEach(b=>b.onclick=()=>{const i=$('#'+b.dataset.qc);i.value='';b.dataset.qc==='q2'?renderDan2():renderKensa();i.focus()});
['dragover','drop'].forEach(t=>window.addEventListener(t,e=>{if(!e.target.closest||!e.target.closest('#sDrop'))e.preventDefault()}));
/* 手動更新：未送信を送り、最新を受け取って画面を描き直す */
$('#btnRef').onclick=async()=>{
  if(live()){await flush();await poll();await fetchMaster()}else loadJobs();   /* 更新：品番マスタ（客先のボタン）も読み直す */
  if(view==='jisseki')renderJisseki();else{d1Built=false;renderAll()}
  toast('最新の状態に更新しました（'+hm(Date.now())+'）');
};
$('#btnFull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};

/* ====== 起動 ====== */
loadJobs();layout();renderAll();tick();
if(live()){flush();poll();fetchMaster().then(ok=>{if(ok)renderAll()})}   /* 品番マスタを読んだら客先のボタンを描き直す */
if(live()&&(firstRun||!S.key))setTimeout(openSettings,500);   /* 初めて開いたタブレット（配布用ファイル・Google）：タブレット名・役割（・合言葉）を入れてもらう */
</script>
